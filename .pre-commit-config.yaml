# Pre-commit hooks configuration
#
# 安装（本仓库推荐用后端 venv 的解释器，不污染系统 Python）：
#   Windows:  backend\.venv\Scripts\python.exe -m pip install pre-commit
#             backend\.venv\Scripts\python.exe -m pre_commit install
#   Linux:    backend/.venv/bin/python -m pip install pre-commit
#             backend/.venv/bin/python -m pre_commit install
#
# 为什么本地钩子用 `language: python`（2026-10-26 体检后改）：
#   `language: system` 直接执行 `python scripts/...`，依赖 `python` 在 PATH 上。
#   本机（以及不少离线/沙箱环境）根本没有 `python` —— 强行安装钩子会让**每一次
#   git commit 都失败**。`language: python` 由 pre-commit 用"运行 pre-commit 的那个
#   解释器"建独立 venv，并把它的 `python` 放到 PATH 前面，因此与本机 PATH 无关。
#   钩子脚本本身全部是标准库实现，不需要额外依赖；flake8 / bandit 用
#   additional_dependencies 装进各自环境。
#
# 关于 electron 语法检查：原先用 `bash -c 'for f in electron/*.js; do node --check'`。
#   Windows 上 `bash` 常解析到 C:\Windows\System32\bash.exe（没装发行版的 WSL 启动器），
#   钩子必然失败；改为 `node scripts/check_electron_syntax.js`，跨平台一致。
#
# 增强配置 (v1.2.0+):
# - lint-staged: 仅检查变更文件，加速提交
# - ruff: Python 快速 lint+fix (替代部分 flake8)
# - flake8/bandit/vue-tsc: 全量质量门禁 (通过 scripts/pre_commit_hooks.py)

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
        exclude: ^logs/|\.log$
      - id: check-yaml
        exclude: ^k8s/
      - id: check-json
      - id: check-added-large-files
        args: ['--maxkb=1024']
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: ['--fix=lf']

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.5.0
    hooks:
      - id: ruff
        args: [--fix, --line-length=120]
        files: ^backend/
        exclude: ^backend/alembic/versions/

  - repo: local
    hooks:
      - id: check-dockerfile-tail
        name: check Dockerfile RUN has | tail
        entry: python scripts/pre_commit_hooks.py check_dockerfile_tail
        language: python
        files: ^docker/Dockerfile
        pass_filenames: false
        stages: [pre-commit]

      - id: check-hardcoded-styles
        name: check hardcoded styles (UI v2.0 guard)
        entry: python scripts/check_hardcoded_styles.py --staged
        language: python
        files: ^frontend/src/.*\.vue$
        pass_filenames: false
        stages: [pre-commit]

      - id: electron-syntax-check
        name: node --check electron main process (mojibake guard, 10c56cd0 regression)
        entry: node scripts/check_electron_syntax.js
        language: system
        files: ^electron/.*\.js$
        pass_filenames: false
        stages: [pre-commit]

      - id: scan-corrupted-files
        name: scan NUL bytes / non-UTF8 corrupted files (CodeCheck FAILURE guard)
        entry: python scripts/scan_mojibake.py --check
        language: python
        pass_filenames: false
        stages: [pre-commit]

      - id: check-css-vars
        name: check quadruple-dash CSS var typo (transparent-bg guard, 2026-08-29 regression)
        entry: python scripts/check_css_vars.py --staged
        language: python
        files: \.(scss|css|vue)$
        pass_filenames: false
        stages: [pre-commit]

      - id: check-tokens-sync
        name: check tokens dual-source sync (W11-043 guard)
        entry: python scripts/check_tokens_sync.py --staged
        language: python
        files: ^frontend/src/styles/(tokens|tokens-vars)\.scss$
        pass_filenames: false
        stages: [pre-commit]

      - id: flake8
        name: flake8
        entry: python scripts/pre_commit_hooks.py flake8
        language: python
        additional_dependencies: [flake8]
        pass_filenames: false
        stages: [pre-push]

      - id: bandit
        name: bandit (security)
        entry: python scripts/pre_commit_hooks.py bandit
        language: python
        additional_dependencies: [bandit]
        pass_filenames: false
        stages: [pre-push]

      # 注意：id 不能重复（pre-commit 按 id 定位钩子）。历史上两条都叫
      # check-tokens-sync，第二条永远不会被单独点名，故改为 -files 后缀。
      - id: check-tokens-sync-files
        name: check-tokens-sync (tokens.scss vs tokens-vars.scss)
        entry: python scripts/check_tokens_sync.py
        language: python
        files: ^frontend/src/styles/tokens.*\.scss$
        pass_filenames: false
        stages: [pre-commit]

      - id: vue-tsc
        name: vue-tsc
        entry: python scripts/pre_commit_hooks.py vue_tsc
        language: python
        pass_filenames: false
        stages: [pre-push]

      # 2026-10-25 事故教训：MAX_PAGE_SIZE 100→200 后测试仍断言 100，
      # 本地只跑相关套件没发现，CI seg10 才红 → PR Checks 红 → 发布被拒。
      # 本 hook 在 push 前机械扫描"常量 vs 测试/文档字面量"漂移。
      - id: check-constants-sync
        name: check constants vs test/doc literals (constant drift guard)
        entry: python scripts/check_constants_sync.py
        language: python
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      # 2026-10-25 事故教训：Nightly 的 6 段测试分组漏了 backend/tests/*.py 根目录，
      # 导致 permission_packs 夜间覆盖率 38%、Nightly 恒红而 PR Checks 全绿。
      - id: check-nightly-test-parity
        name: nightly test coverage parity (PR Checks vs Nightly grouping)
        entry: python scripts/check_nightly_test_parity.py
        language: python
        pass_filenames: false
        always_run: true
        stages: [pre-push]

# CI workflows:
# - pre-commit 阶段: ruff (快速)、trailing-whitespace、YAML/JSON 检查、损坏扫描
# - pre-push 阶段: flake8, bandit, vue-tsc (全量质量门禁)
# - 推荐配合 lint-staged (见 frontend/package.json):
#   npx lint-staged  # 仅检查 git 暂存文件
