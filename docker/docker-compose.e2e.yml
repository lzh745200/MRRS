# ============================================================
# E2E 测试 Docker 环境
# 用法: docker compose -f docker-compose.yml -f docker/docker-compose.e2e.yml up
# ============================================================
# 注意: Docker Compose V2 已废弃 version 字段，此处不再声明

services:
  # E2E 后端：固定管理员口令为 admin123（与 e2e-playwright 的 E2E_PASSWORD 一致）。
  # 生产/出厂种子口令是 zgcZGC733035#（app/core/constants.py），仅测试环境用此处覆盖；
  # 注意 must_change_password 仍为 true —— tests/e2e/test_e2e.py 的 auth_payload
  # 会话级 fixture 会自动完成"首登改密 + 重新登录"。
  assistance-system:
    environment:
      - DEFAULT_ADMIN_PASSWORD=admin123

  # Playwright E2E 测试运行器
  e2e-playwright:
    image: mcr.microsoft.com/playwright:v1.45.0-jammy
    container_name: assistance-e2e
    profiles:
      - e2e
      - full
    working_dir: /e2e
    environment:
      - E2E_BASE_URL=http://assistance-system:8000
      - E2E_API_URL=http://assistance-system:8000
      - E2E_USERNAME=admin
      - E2E_PASSWORD=admin123
      - CI=true
    volumes:
      - ../tests/e2e:/e2e
      - ../frontend:/frontend:ro
    depends_on:
      assistance-system:
        condition: service_healthy
    command: >
      bash -c "
        pip install pytest pytest-playwright pytest-timeout httpx &&
        python -m playwright install chromium &&
        python -m pytest /e2e/test_e2e.py -v --tb=short --timeout=60
      "
    networks:
      - assistance-network

  # 性能测试（Locust）
  e2e-locust:
    image: locustio/locust:2.28
    container_name: assistance-locust
    profiles:
      - performance
      - full
    environment:
      - LOCUST_HOST=http://assistance-system:8000
      - LOCUST_USERS=50
      - LOCUST_SPAWN_RATE=5
      - LOCUST_RUN_TIME=5m
    volumes:
      - ../tests/performance:/mnt/locust
    depends_on:
      assistance-system:
        condition: service_healthy
    command: -f /mnt/locust/locustfile.py --headless
    networks:
      - assistance-network
    ports:
      - "8089:8089"

networks:
  # W4-T4（2026-10-18）：不能标 external: true —— 干净机器上网络尚不存在时，
  # compose 会直接报 "network assistance-network declared as external, but could
  # not be found" 而中止（此前 `make test-e2e-docker` 在全新环境必失败）。
  # 根 docker-compose.yml 已声明同名网络（name: assistance-network），此处与
  # 之对齐（仅 name，不标 external），compose 会自动创建/复用同一网络，
  # 两个 overlay 服务经它访问 assistance-system。
  assistance-network:
    name: assistance-network
