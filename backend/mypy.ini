[mypy]
ignore_missing_imports = True
no_implicit_optional = False
# SQLAlchemy declares model fields as Column[T] on the class but exposes T on instances.
# The official mypy plugin maps instance attribute access back to T; without it every
# `TodoResponse(id=todo.id)` is rejected as Column[int] -> int (the bulk of
# assignment/arg-type noise in this repo). Keep this file ASCII-only: mypy reads the
# config with the platform locale encoding (GBK here), so non-ASCII bytes crash it.
plugins = sqlalchemy.ext.mypy.plugin, pydantic.mypy

# pydantic v2 models expose defaults through ModelMetaclass (a dataclass_transform).
# Without the official plugin mypy treats every ``x: T = Field(default, ...)`` that
# follows a required field as required, so perfectly valid calls such as
# ``Schema(required=1)`` fail with 'Missing named argument "x"' (28 false positives
# across the repo as of 2026-10-31). The plugin also maps aliases to keyword names.
# Keep this file ASCII-only: mypy reads the config with the platform locale
# encoding (GBK here), so non-ASCII bytes crash it.
[pydantic-mypy]
init_forbid_extra = False
init_typed = False
warn_required_dynamic_aliases = False

[mypy-app.models.*]
ignore_errors = True

[mypy-app.alembic.*]
ignore_errors = True