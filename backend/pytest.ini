[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=line --strict-markers
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    unit: unit tests
    integration: integration tests (need database)
    security: security-related tests
    approval: approval workflow tests
    e2e: end-to-end tests
    stress: marks tests as stress tests
    performance: marks tests as performance tests
    real_backend_dir: 豁免 conftest 的数据目录隔离（专测 paths.py 解析逻辑，需真实 get_project_backend_dir）
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
filterwarnings =
    # ── 第三方库弃用（不在本仓控制范围，模块级精准过滤；禁止再加全局
    #    ignore::DeprecationWarning —— 2026-08-30 警告治理：全局过滤会掩盖
    #    自有代码的真实弃用/资源泄漏信号）──
    ignore:Using.*httpx.*with.*starlette.testclient.*is deprecated:Warning
    ignore:transaction already deassociated from connection:Warning
    ignore::DeprecationWarning:pydantic.*
    ignore::PendingDeprecationWarning:pydantic.*
    ignore::DeprecationWarning:httpx.*
    ignore::DeprecationWarning:app.services.event_bus.*
    ignore::pytest.PytestConfigWarning:_pytest.config.*
    # 有意保留的弃用通知（自动补列兜底 → Alembic 迁移），测试中重复触发
    ignore:_migrate_missing_columns 已弃用.*:DeprecationWarning
    # stevedore(bandit 依赖) 内部弃用 —— 第三方, 无法在本仓修复
    ignore:The verify_requirements argument is now a no-op.*:DeprecationWarning
    # 弃用方法专项测试（TestRevokePermissionSingularDeprecated）刻意调用
    # 弃用 API 以锁定 flush-not-commit 行为，其弃用通知属预期
    ignore:RBACService.revoke_permission 已弃用.*:DeprecationWarning
    # fire-and-forget / AsyncMock 测试刻意产生的未 await 协程（良性，非产品缺陷）
    ignore:coroutine '.*' was never awaited:RuntimeWarning
