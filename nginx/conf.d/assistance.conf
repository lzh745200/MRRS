# nginx/conf.d/assistance.conf
upstream backend {
    server assistance-system:8000;
}

server {
    listen 80;
    server_name localhost;

    # 前端静态文件
    location / {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API 接口
    # ^~ 前缀匹配：阻止下方正则静态资源 location 抢匹配（否则 /api/.../x.png 这类
    # API 下载会被 nginx 追加 public/immutable 缓存头，覆盖后端按用户裁剪的缓存策略）。
    location ^~ /api/ {
        proxy_pass http://backend/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # W24：备份恢复上传上限 10GB（后端 BodySizeLimitMiddleware 按路径放行
        # /api/v1/system/backup），全局 100M 会让 restore 在 nginx 层直接 413。
        # 其余路径仍受后端 10MB/分级 multipart 上限约束。
        client_max_body_size 10g;
        # 大包导入/备份恢复为长耗时请求：默认 60s 会 504（后端仍在处理）。
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        # 关闭请求体缓冲会让大上传直通后端；保持默认 on（落临时文件）以限制内存。
    }

    # API 文档
    location /docs {
        proxy_pass http://backend/docs;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 健康检查
    location /health {
        proxy_pass http://backend/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 静态资源缓存
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        proxy_pass http://backend;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
