name: PR Checks

on:
  # push 到 main 同样必须过门禁：build-* 只在 tag v* 触发、nightly 只在定时触发，
  # 此处若不写 push，直接推 main 将没有任何 CI 运行 —— 而 AGENTS.md 早已声称
  # “push main 只跑 PR Checks”，配置与文档长期不符，main 实际处于无门禁状态。
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 并发组按 github.ref 区分：push 为 refs/heads/main、PR 为 refs/pull/N/merge，
# 二者互不取消。
concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: '3.11' }
      - run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      # 覆盖率门禁：阈值统一由 backend/.coveragerc 的 fail_under 单一承载
      # (不再内联 --cov-fail-under，命令行参数会屏蔽配置文件口径)；
      # pytest-cov 读取 .coveragerc fail_under 并在未达标时真实阻断(失败即红)。
      # 注意：--dist loadfile 与 pytest-rerunfailures 不兼容（worker 崩溃时
      # mark_test_pending 在 loadscope 调度器上抛 NotImplementedError），
      # 使用默认 load 调度器让 rerun 正常生效。
      # 输出 tee 到 runner.temp 日志并开 pipefail；加 --cov-report=term-missing 让未覆盖
      # 行可见。失败时下方步骤提炼 ::error:: + upload-artifact——因为原"Report failed
      # tests"用 --lf --no-cov 重跑，无法复现覆盖率不达标(fail_under=100)这类失败，
      # 届时只会看到进度点而看不到真因；artifact 是公开仓库可下载的完整证据通道。
      - name: Backend tests + coverage
        run: |
          cd backend
          LOG="$RUNNER_TEMP/pytest.log"
          {
            echo "===== ENV SNAPSHOT ====="
            python --version
            echo "os: $(uname -a)"
            echo "nproc: $(nproc)"
            free -m 2>/dev/null || echo "(free unavailable)"
            echo "========================"
          } > "$LOG"
          set -o pipefail
          python -m pytest tests/ -q --tb=line -n auto --cov=app --cov-report=xml --cov-report=term-missing --reruns 2 --reruns-delay 1 2>&1 | tee -a "$LOG"
      - name: Report backend failure
        if: failure()
        run: |
          LOG="$RUNNER_TEMP/pytest.log"
          # 关键信号优先(annotation 上限 ~10 条，GitHub 保留最先发出的)：
          # 先出 term-missing 表里覆盖率 <100% 的文件行——它直接带 Missing 列(未覆盖行号)，
          # 即 4 处缺口的精确位置；避免再用裸 "error" 匹配到 api_error.py 等 100% 文件刷屏。
          echo "===== files with MISSING coverage (<100%, 带 Missing 行号) ====="
          grep -E "\.py " "$LOG" | grep -vE " 100%| 100\.00%" | head -20 | sed 's/^/::error::/' || true
          echo "===== coverage failure / test failures ====="
          grep -nE "Coverage failure|Required test coverage|^TOTAL|FAILED|ERROR: " "$LOG" | head -20 | sed 's/^/::error::/' || true
          exit 1
      - name: Upload pytest log
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pytest-log
          path: ${{ runner.temp }}/pytest.log
          if-no-files-found: ignore
          retention-days: 7
      # 上传覆盖率到 Codecov（展示用：fail_ci_if_error=false 且 continue-on-error，
      # 覆盖率阻断由上方 pytest-cov 读取 .coveragerc fail_under 承担，上传抖动不阻塞 PR）
      - uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4
        with:
          directory: backend
          flags: backend
          fail_ci_if_error: false
        continue-on-error: true

  frontend-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Node 24（勿改回 22）：Node22 的 V8 在全量 299 文件跨分片合并覆盖率时有幻影——
      # 同一 .vue（典型 src/views/auth/LoginEnhanced.vue）被多个测试文件重编译后，合并出
      # count-0 的模板内联 v-model 处理器 / import 访问器（funcs 88.23%、未覆盖行 82/183），
      # 使 src/views 阈值跌到 99.91% 而门禁变红；隔离单跑恒 100%、maxWorkers:1 无效。
      # Node24 的 V8 无此幻影（WSL 全量实测 299 文件 100%，且本地开发即 Node 24.18）。
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with: { node-version: '24' }
      - run: |
          cd frontend
          npm ci --legacy-peer-deps
      - run: cd frontend && npx vue-tsc --noEmit 2>&1
      # lint:check 为纯检查模式（不带 --fix），CI 必须真实暴露 lint 违规而非自动修复
      - run: cd frontend && npm run lint:check 2>&1
      # 前端测试带覆盖率报告（vitest run --coverage）
      # 显式幂等执行 #9758 分片镜像补丁：npm ci 的 postinstall 理论上已执行，但缓存/顺序
      # 不确定时在此兜底，确保 Linux runner 上补丁一定就位（脚本幂等，重复执行无副作用）。
      # 输出 tee 到 runner.temp 日志并开 pipefail：失败时下方诊断步骤上传 artifact + 提炼
      # ::error::。Linux 专有失败在本地 Windows 无法复现、job 日志又需 admin（403），
      # artifact 是唯一可下载的完整证据通道。
      - name: Frontend tests + coverage
        run: |
          cd frontend
          node scripts/patch-vitest-coverage.cjs
          LOG="$RUNNER_TEMP/vitest-coverage.log"
          # 先落环境快照：maxWorkers:1 让单 worker 累积 299 文件 v8 覆盖率，内存峰值高，
          # 7GB runner 上可能 OOM（exit 1）。artifact 里有 node 版本/内存/堆上限才能区分
          # OOM 崩溃 vs 真实断言/阈值失败。
          {
            echo "===== ENV SNAPSHOT ====="
            echo "node: $(node -v)  npm: $(npm -v)"
            echo "os: $(uname -a)"
            echo "nproc: $(nproc)"
            free -m 2>/dev/null || echo "(free unavailable)"
            echo "node heap limit (MB): $(node -e 'console.log(Math.round(require("v8").getHeapStatistics().heap_size_limit/1048576))')"
            echo "ulimit -v: $(ulimit -v)"
            echo "========================"
          } > "$LOG"
          set -o pipefail
          npx vitest run --coverage 2>&1 | tee -a "$LOG"
      - name: Report vitest failure
        if: failure()
        run: |
          LOG="$RUNNER_TEMP/vitest-coverage.log"
          # 关键信号优先(annotation 上限 ~10 条，保留最先发出的)：先出硬失败信号
          # (覆盖率阈值不达 / OOM / ENOENT / 失败用例标记 / Test Files N failed 汇总)，
          # 不再匹配 ✓(299 行通过用例会刷屏挤掉真因)。
          echo "===== vitest hard-failure signal ====="
          grep -nE "ERROR: Coverage|does not meet|heap out of memory|FATAL ERROR|Reached heap limit|Allocation failed|Failed Tests|FAIL |AssertionError|Cannot find module|ENOENT|Test Files +[0-9]+ failed|Tests +[0-9]+ failed" "$LOG" | head -25 | sed 's/^/::error::/' || true
          echo "===== coverage rows below 100 ====="
          # 仅匹配覆盖率表格行(token 后跟可选空白再跟 `|`)，排除 `List.test.ts (63 tests)`
          # 这类通过用例结果行(含 `.ts ` 但无 `|`)——旧模式会刷屏挤掉真因(annotations 上限 ~10)。
          grep -E "(\.vue|\.ts|All files)[[:space:]]*\|" "$LOG" | grep -vE "\|[[:space:]]*100[[:space:]]*\|[[:space:]]*100[[:space:]]*\|[[:space:]]*100[[:space:]]*\|[[:space:]]*100" | head -30 | sed 's/^/::error::/' || true
          exit 1
      - name: Upload vitest log
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vitest-coverage-log
          path: ${{ runner.temp }}/vitest-coverage.log
          if-no-files-found: ignore
          retention-days: 7
      # 上传覆盖率到 Codecov
      - uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4
        with:
          directory: frontend
          flags: frontend
          fail_ci_if_error: false
        continue-on-error: true

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: '3.11' }
      - run: pip install flake8 mypy bandit
      # flake8 零错误门禁
      - run: cd backend && python -m flake8 app/ --max-line-length=120 --count --max-complexity=16
      # mypy 类型检查（非阻断，但报告类型问题）
      - name: mypy type check
        run: cd backend && python -m mypy app/ --config-file=mypy.ini --ignore-missing-imports || true
      # bandit 安全扫描（低级别，阻断）
      - name: bandit security scan
        run: cd backend && python -m bandit -r app/ -ll

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: '3.11' }
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with: { node-version: '22' }
      # 后端依赖漏洞扫描（pip-audit）
      - run: pip install pip-audit pip-licenses
      - name: Backend dependency audit
        run: pip-audit -r backend/requirements.txt
        continue-on-error: true  # 依赖漏洞提示, 不阻断合并/构建
      # 前端依赖漏洞扫描（npm audit，仅 high 以上阻断）
      - name: Frontend dependency audit
        run: |
          cd frontend
          npm install --legacy-peer-deps
          npm audit --audit-level=high
      # 生成 SBOM（许可证清单），作为 artifact 上传供军口许可证白名单审查
      - name: Generate SBOM (license list)
        run: |
          pip-licenses --from=mixed --with-system --with-description --format=csv --output-file=sbom.csv || true
      - name: Upload SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom-license-list
          path: sbom.csv
          if-no-files-found: warn

  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: '3.11' }
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with: { node-version: '22' }
      # 版本一致性门禁：sync-version.js --check 检测 13 处版本号漂移
      # 软删除过滤静态扫描：新增对软删模型的无 is_active 聚合/列表查询即失败
      - name: Soft-delete filter guard
        run: python backend/scripts/check_soft_delete_usage.py
      - name: Version consistency check
        run: node scripts/sync-version.js --check
      # 前后端菜单对齐门禁：前端菜单 key/path 与后端 MENU_DEFINITIONS/前端路由一致
      - name: Menu alignment check
        run: python scripts/check_menu_alignment.py
      # 后端综合安全审计：裸 db.commit()、跨组织删除、缺 ok_list/write_work_log/filter_by_data_scope
      - name: Backend comprehensive security audit
        run: python scripts/security_audit.py --verbose
