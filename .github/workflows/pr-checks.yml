name: PR Checks

on:
  # push 到 main 同样必须过门禁：build-* 只在 tag v* 触发、nightly 只在定时触发，
  # 此处若不写 push，直接推 main 将没有任何 CI 运行 —— 而 AGENTS.md 早已声称
  # “push main 只跑 PR Checks”，配置与文档长期不符，main 实际处于无门禁状态。
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 并发组按 github.ref 区分：push 为 refs/heads/main、PR 为 refs/pull/N/merge。
# cancel-in-progress **只对 PR 生效**（2026-10-25 修正）：
# 原来对 main 也取消，导致连续快速推送时前一次运行被中断 —— 实测 2026-10-25 的
# main 上连续 5 次运行**全部 cancelled**，那段时间等于没有任何一次完整验证，
# 而"推送成功"极易被误当成"验证通过"。main 改为排队（不取消），
# 配合 scripts/check_main_ci.py（打 tag 前确认该 commit 的 PR Checks 已 success）。
concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  # 全部作业加 timeout-minutes（R28 低危清理）：GitHub 默认 360 分钟，作业一旦卡死
  # （网络挂起 / xdist worker 僵死 / 浏览器下载无响应）会白占并发额度并延迟 PR 反馈。
  # 预算按实测耗时给约 2 倍余量，只拦"卡死"，不误伤正常慢跑。
  backend-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 90   # 实测双遍全量（覆盖 + 分支棘轮）约 40-50 分钟
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: '3.11' }
      - run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      # ===== W24（v1.15.5）后端测试分段：独立进程 + 逐段可定位 =====
      # 历史故障（v1.15.0~v1.15.4）：单个大进程约 24 分钟后消失（exit 1、无 FAILED
      # 摘要、无覆盖率汇总表），日志停在 integration 段附近；xdist 与串行均复现，
      # 符合 runner 内存峰值/进程被杀的签名（v1.15.3/v1.15.4 注释与 run annotation）。
      # 规避手段：
      #  1) 拆 6 个独立 pytest 进程（integration/security + unit 按目录/首字母均衡拆），
      #     每进程退出即释放内存与覆盖率对象，单段峰值远低于全量；
      #  2) 每段独立日志 + scripts/ci_backend_test_segment.sh：失败时把该段真实
      #     FAILED/ERROR（无摘要则打日志尾部并标注「疑似被杀」）输出为 ::error::，
      #     不再把 pytest 进度行误报成覆盖率缺口；
      #  3) 覆盖率 --cov-append 跨进程合并：前 5 段 --cov-fail-under=0，第 6 段
      #     不加该参数 → 仍由 backend/.coveragerc fail_under=100 单一来源判定。
      - name: Reset coverage data
        run: rm -f backend/.coverage

      # v1.15.11：12 段细粒度执行（单段测试量降至 ~1,000–2,500，显著降低 SQLAlchemy C 扩展
      # 在 GitHub runner 上的 SIGSEGV 概率；每段独立进程 + 独立日志 + 失败信号）。
      # PYTHONFAULTHANDLER=1：若仍崩溃，日志会打印 Python 级栈便于最终定位。
      - name: "Backend tests + coverage (1/12: integration + security)"
        env: { PYTHONFAULTHANDLER: "1" }
        run: cd backend && bash ../scripts/ci_backend_test_segment.sh --name seg01-integration --mode first tests/integration tests/security

      - name: "Backend tests + coverage (2/12: unit api)"
        env: { PYTHONFAULTHANDLER: "1" }
        run: cd backend && bash ../scripts/ci_backend_test_segment.sh --name seg02-unit-api --mode partial tests/unit/api

      - name: "Backend tests + coverage (3/12: unit services/middleware/interfaces/utils)"
        env: { PYTHONFAULTHANDLER: "1" }
        run: cd backend && bash ../scripts/ci_backend_test_segment.sh --name seg03-unit-services --mode partial tests/unit/services tests/unit/middleware tests/unit/interfaces tests/unit/utils

      - name: "Backend tests + coverage (4/12: unit root a-e-f)"
        env: { PYTHONFAULTHANDLER: "1" }
        run: cd backend && bash ../scripts/ci_backend_test_segment.sh --name seg04-unit-root-a --mode partial tests/unit/test_a*.py tests/unit/test_e*.py tests/unit/test_f*.py

      - name: "Backend tests + coverage (5/12: unit root i-n-o)"
        env: { PYTHONFAULTHANDLER: "1" }
        run: cd backend && bash ../scripts/ci_backend_test_segment.sh --name seg05-unit-root-i --mode partial tests/unit/test_i*.py tests/unit/test_n*.py tests/unit/test_o*.py

      - name: "Backend tests + coverage (6/12: unit root p-t-u)"
        env: { PYTHONFAULTHANDLER: "1" }
        run: cd backend && bash ../scripts/ci_backend_test_segment.sh --name seg06-unit-root-p --mode partial tests/unit/test_p*.py tests/unit/test_t*.py tests/unit/test_u*.py

      - name: "Backend tests + coverage (7/12: unit root w-y-z)"
        env: { PYTHONFAULTHANDLER: "1" }
        run: cd backend && bash ../scripts/ci_backend_test_segment.sh --name seg07-unit-root-w --mode partial tests/unit/test_w*.py tests/unit/test_y*.py tests/unit/test_z*.py

      - name: "Backend tests + coverage (8/12: unit root b-d)"
        env: { PYTHONFAULTHANDLER: "1" }
        run: cd backend && bash ../scripts/ci_backend_test_segment.sh --name seg08-unit-root-b --mode partial tests/unit/test_b*.py tests/unit/test_d*.py

      - name: "Backend tests + coverage (9/12: unit root g-h-j-l)"
        env: { PYTHONFAULTHANDLER: "1" }
        run: cd backend && bash ../scripts/ci_backend_test_segment.sh --name seg09-unit-root-g --mode partial tests/unit/test_g*.py tests/unit/test_h*.py tests/unit/test_j*.py tests/unit/test_l*.py

      - name: "Backend tests + coverage (10/12: unit root m-q-s)"
        env: { PYTHONFAULTHANDLER: "1" }
        run: cd backend && bash ../scripts/ci_backend_test_segment.sh --name seg10-unit-root-m --mode partial tests/unit/test_m*.py tests/unit/test_q*.py tests/unit/test_s*.py

      - name: "Backend tests + coverage (11/12: tests root)"
        env: { PYTHONFAULTHANDLER: "1" }
        run: cd backend && bash ../scripts/ci_backend_test_segment.sh --name seg11-tests-root --mode partial tests/test_*.py

      - name: "Backend tests + coverage (12/12: unit root c-r-v, final coverage gate)"
        env: { PYTHONFAULTHANDLER: "1" }
        run: cd backend && bash ../scripts/ci_backend_test_segment.sh --name seg12-unit-root-c --mode final tests/unit/test_c*.py tests/unit/test_r*.py tests/unit/test_v*.py
      # 抖动账本（2026-10-17）：把 --reruns 掩盖的不确定性显式化并留存 90 天。
      # 只告警不阻断（真实抖动需要人看清单决定"先修/再隔离"），阈值 3。
      - name: Flaky test ledger
        if: always()
        run: |
          shopt -s nullglob
          LOGS=("$RUNNER_TEMP"/pytest-seg-*.log)
          if [ ${#LOGS[@]} -eq 0 ]; then
            echo "no pytest segment logs found — skipping flaky ledger"
            exit 0
          fi
          ARGS=()
          for f in "${LOGS[@]}"; do ARGS+=(--log "$f"); done
          python scripts/ci_flake_report.py "${ARGS[@]}" --out flaky-report.txt --warn-reruns 3
      - name: Upload flaky ledger
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: flaky-ledger
          path: flaky-report.txt
          if-no-files-found: warn
          retention-days: 90
      # 分支覆盖棘轮（2026-10-06 测试质量审计 P0-1）：
      # .coveragerc 门禁度量语句+分支，"语句 100%" 对条件组合零约束，故设第二道防线：
      # 把分支覆盖率钉在 100% 基线（只紧不松），失败时输出缺口最大的文件清单。
      # **2026-10-17（W19）改为消费上一步产出的 coverage-branch.json**，不再重复跑
      # 全量 pytest —— 重复运行（第二个 xdist 数据面）曾让本步与上一步结论不一致，
      # 出现"step5 通过、step8 报 99.61%"的随机红。
      - name: Branch coverage ratchet
        run: |
          cd backend
          python ../scripts/check_branch_coverage.py \
            --json coverage-branch.json \
            --baseline scripts/gate_baselines/branch_coverage_baseline.json
      - name: Upload branch coverage json
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: branch-coverage
          path: backend/coverage-branch.json
          if-no-files-found: ignore
      # 覆盖率缺口可见清单（2026-10-25）：`fail_under=100` 只告诉"红了"，
      # 这一步把未覆盖语句行/分支按文件列出来，写进 $GITHUB_STEP_SUMMARY 并留 artifact，
      # 避免下一个人用 pragma/skip 糊过去（豁免理由棘轮仍会拦，但先给他一条正路）。
      - name: Coverage gaps (backend)
        if: always()
        run: |
          JSON=backend/coverage-branch.json
          [ -f "$JSON" ] || JSON=backend/coverage.json
          python scripts/coverage_gaps.py --coveragepy "$JSON" --out coverage-gaps-backend.md --title "后端覆盖率缺口"
      - name: Upload coverage gaps (backend)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-gaps-backend
          path: coverage-gaps-backend.md
          if-no-files-found: warn
          retention-days: 30
      - name: Report backend failure
        if: failure()
        run: |
          shopt -s nullglob
          LOGS=("$RUNNER_TEMP"/pytest-seg-*.log)
          echo "===== 各段真实失败信号（优先于覆盖率缺口）====="
          for f in "${LOGS[@]}"; do
            echo "----- $(basename "$f") -----"
            grep -aE "^(FAILED|ERROR) |INTERNALERROR|MemoryError|worker crashed|Killed|Out of memory|Coverage failure|Required test coverage" "$f" \
              | head -6 | cut -c1-500 | sed 's/^/::error::/' || true
          done
          echo "===== 覆盖率表未达 100% 的文件（仅最终段）====="
          FINAL=$(ls "$RUNNER_TEMP"/pytest-seg-*final*.log 2>/dev/null | head -1 || true)
          if [ -n "$FINAL" ]; then
            # 仅匹配 term-missing 表行（app/ 文件行或 TOTAL 行），不再匹配 pytest 进度行
            # （tests/xxx.py ..... [ 8%]）——旧实现把进度行误报成覆盖率缺口，真因被淹没。
            grep -aE "^(app/|TOTAL)" "$FINAL" | grep -avE "[[:space:]]100%" | head -10 | cut -c1-500 | sed 's/^/::error::/' || true
          fi
          exit 1
      - name: Upload pytest log
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pytest-log
          path: ${{ runner.temp }}/pytest-seg-*.log
          if-no-files-found: ignore
          retention-days: 7
      # 上传覆盖率到 Codecov（展示用：fail_ci_if_error=false 且 continue-on-error，
      # 覆盖率阻断由上方 pytest-cov 读取 .coveragerc fail_under 承担，上传抖动不阻塞 PR）
      - uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4
        with:
          directory: backend
          flags: backend
          fail_ci_if_error: false
        continue-on-error: true

  frontend-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 45   # 实测安装 + tsc + lint + 覆盖率约 20-25 分钟
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Node 22（与仓库其余 CI 一致）。注意：src/views/auth/LoginEnhanced.vue 全量跑 functions
      # 跌到 88.23% 曾长期被误诊为"Node22 V8 跨分片合并幻影"并据此把此处升到 24，但 Node24 的 CI
      # 复现完全相同的 88.23%（f42ae680）——与 Node 版本无关。真因是 istanbul 按函数 id 合并冲突的
      # v8 fnMap：该 .vue 曾被两个测试文件以不同 ElDialog 桩深挂载，AuthViewsBatch 的无 footer 桩少
      # 生成 onClick 处理器 → 17 函数 fnMap 与专属测试的 19 函数 fnMap id 错位，满量 299 分片合并后
      # 2 个内联处理器 count-0。修复=移除 AuthViewsBatch.test.ts 里那段冗余 bare 渲染（每个 .vue 只
      # 由一个测试深挂载）。详见 frontend/vitest.config.ts 注释 (A)。
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          # v1.14.3：缓存 ~/.npm，网络抖动时配合 --prefer-offline 可完全命中缓存
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      # npm 网络抖动治理（2026-10-03）：一次 ECONNRESET 曾让 npm ci 失败 → vitest 压根没
      # 启动，而下方"Report vitest failure"因日志文件不存在又二次失败，annotation 只剩
      # "Process completed with exit code 1"，真因被彻底掩盖。两头都加固：
      # ① setup-node 启用 npm 缓存（~/.npm）；② fetch 重试 + 超时；
      # ③ npm ci 5 轮递增退避且 --prefer-offline（网络不可达时优先命中缓存）；
      # ④ 全部失败后 npm install 兜底（只救网络，lock 漂移由 npm ci 前几轮先行拦截）。
      # 2026-10-28（v1.18.24）：带 restore-keys 的 ~/.npm 缓存。
      # setup-node 的缓存 key 绑死 lock 文件，lock 一变即 miss；restore-keys 让**上一次的
      # 旧缓存**也能复用 —— 配合 install 步骤首试 `npm ci --offline`，缓存命中时零网络安装。
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-
      - name: Install frontend dependencies
        run: |
          cd frontend
          npm config set fetch-retries 5
          npm config set fetch-retry-mintimeout 20000
          npm config set fetch-retry-maxtimeout 120000
          npm config set fetch-timeout 300000
          npm cache verify || true
          # 2026-10-28（v1.18.24）：默认 registry 连续 ECONNRESET 时**切镜像重试**。
          # 实测本仓 runner 的 registry 连接会整段不可用（同一 commit 重跑两次仍红），
          # 而 setup-node 的缓存 key 绑在 package-lock.json 上 —— lock 一改缓存即 miss，
          # `--prefer-offline` 仍需全量下载，于是「重试 5 次 + 兜底」全部落在同一故障窗口。
          # 镜像只在默认源失败后启用，产物语义不变（仍是 npm ci + package-lock）。
          MIRROR="https://registry.npmmirror.com"
          # 首试：完全离线（只吃 ~/.npm 缓存）。缓存命中时**零网络**即可安装 ——
          # 这是 registry 整段不可达时唯一还能出包的路径；未命中会秒失败，不影响后续在线重试。
          if npm ci --legacy-peer-deps --offline --no-fund --no-audit; then
            echo "npm ci OK (offline cache)"
            exit 0
          fi
          for i in 1 2 3 4 5; do
            echo "===== npm ci attempt $i (default registry) ====="
            if npm ci --legacy-peer-deps --prefer-offline --no-fund --no-audit; then
              echo "npm ci OK (attempt $i)"
              exit 0
            fi
            echo "npm ci attempt $i failed; retrying in $((i * 20))s"
            sleep $((i * 20))
          done
          echo "::warning::默认 registry 连续 5 次失败，改用镜像 $MIRROR 重试"
          # 2026-10-28：镜像前先探活，日志能直接证明"镜像是否可达"，不必再猜。
          npm ping --registry "$MIRROR" || echo "::warning::npm ping 镜像失败（继续尝试）"
          # 关键：`npm ci` 默认沿用 package-lock.json 里写死的 resolved URL
          # （本仓 506 个包指向 registry.npmjs.org），只设 --registry **不会**真的改道；
          # 必须加 --replace-registry-host=always 才会把 resolved 的 host 重写成镜像。
          for i in 1 2 3; do
            echo "===== npm ci attempt $i (mirror) ====="
            if npm ci --legacy-peer-deps --no-fund --no-audit \
                 --registry "$MIRROR" --replace-registry-host=always --loglevel=http; then
              echo "npm ci OK via mirror (attempt $i)"
              exit 0
            fi
            sleep $((i * 20))
          done
          echo "::warning::镜像 npm ci 也失败，回退 npm install --prefer-offline（网络兜底）"
          for i in 1 2; do
            if npm install --legacy-peer-deps --no-fund --no-audit --prefer-offline; then
              echo "npm install OK (attempt $i)"
              exit 0
            fi
            sleep $((i * 30))
          done
          echo "::error::npm ci/npm install 连续失败 —— 疑似 registry 网络故障或 package-lock 不一致，非业务代码问题"
          exit 1
      - run: cd frontend && npx vue-tsc --noEmit 2>&1
      # Electron 外壳单测（Node 内置 test runner，零第三方依赖）：
      # 覆盖 electron/file-chunk.js、path-guard.js、worker-pool.js（分片写入、路径越界防护、线程池）。
      # 这三个文件此前**有测试但无人执行**（package.json 无脚本、CI 无步骤），属"孤儿测试"——
      # 2026-10-25 实测逐个跑均为 EXIT=0，正因如此才更危险：它们会在将来悄悄失效而无人发现。
      # 不依赖 electron 运行时（只用 assert/fs/os/path/crypto + 相对模块），故无需 npm ci。
      - name: Electron shell unit tests
        run: npm run test:electron
      # lint:check 为纯检查模式（不带 --fix），CI 必须真实暴露 lint 违规而非自动修复
      - run: cd frontend && npm run lint:check 2>&1
      # 前端测试带覆盖率报告（vitest run --coverage）
      # 说明（2026-09-11 校正）：仓库实际仍为 vitest ^3.2.7 + postinstall 打
      # patch-vitest-coverage.cjs —— #9758（分片读回 ENOENT 竞态）在 3.x 仍存在，
      # 由该补丁在内存镜像层根治。曾经尝试升到 vitest 5（以为 v5 已在
      # BaseCoverageProvider 内自治），但升级未完成：@vitest/coverage-v8 仍在 3.x
      # 版本线，且 v5 打包产物使补丁锚点失配而 fail-loud（“存在多个
      # coverage.*.js”）→ postinstall 失败 → npm ci 整体失败 → 本 job 与
      # security/e2e-test 三任务全红（60cea85f）。现已回到 ^3.2.7。
      # vitest 5 迁移作为后续专项：需同步升 @vitest/coverage-v8、重定锚点（或
      # 确认 v5 真正自治 #9758 后删除补丁）并重标定 12 项覆盖率阈值。
      # 输出 tee 到 runner.temp 日志并开 pipefail：失败时下方诊断步骤上传 artifact + 提炼
      # ::error::。Linux 专有失败在本地 Windows 无法复现、job 日志又需 admin（403），
      # artifact 是唯一可下载的完整证据通道。
      - name: Frontend tests + coverage
        env:
          # 单进程 v8 覆盖率内存贴着 7GB runner 的悬崖（见下方注释）。压低 V8 堆上限，
          # 让 GC 在内核 OOM-KILL 之前更积极回收；真不够时会以清晰 FATAL 落日志
          # （Report 步骤可提炼）而非被静默 SIGKILL。
          NODE_OPTIONS: --max-old-space-size=5632
        run: |
          cd frontend
          LOG="$RUNNER_TEMP/vitest-coverage.log"
          # 先落环境快照：artifact 里有 node 版本/内存/堆上限才能区分 OOM 崩溃 vs
          # 真实断言/阈值失败。
          {
            echo "===== ENV SNAPSHOT ====="
            echo "node: $(node -v)  npm: $(npm -v)"
            echo "os: $(uname -a)"
            echo "nproc: $(nproc)"
            free -m 2>/dev/null || echo "(free unavailable)"
            echo "node heap limit (MB): $(node -e 'console.log(Math.round(require("v8").getHeapStatistics().heap_size_limit/1048576))')"
            echo "ulimit -v: $(ulimit -v)"
            echo "========================"
          } > "$LOG"
          set -o pipefail
          # 2026-10-06：303 文件 + maxWorkers:1 的单进程 v8 覆盖率在 7GB runner 上
          # 内存贴悬崖（近三轮 1 绿 2 红被 OS 硬杀，日志零错误信号；本地 16m42s 全绿
          # 证明套件无回归，属 runner 资源边缘问题）。缓解：
          #   1) CI 报告去掉 html（262 文件逐页嵌源码，报告期内存大头）；
          #      json 保留 —— 供下方 codecov 上传。
          #   2) NODE_OPTIONS 压堆上限（见上）。
          #   3) 整门禁自动重试一次 —— 内存边缘问题上 GC 时序的差异足以决定成败，
          #      同一提交第二次运行往往通过（曾试点 v8 分片 + 位置并集合并，因 v8 的
          #      statement/branch/fn 结构随执行状态漂移而不可靠，已放弃）。
          overall=1
          for attempt in 1 2; do
            echo "===== coverage attempt $attempt =====" | tee -a "$LOG"
            if npx vitest run --coverage --coverage.reporter=text --coverage.reporter=json 2>&1 | tee -a "$LOG"; then
              overall=0
              break
            fi
            echo "attempt $attempt 失败，15s 后重试" | tee -a "$LOG"
            rm -rf coverage
            sleep 15
          done
          [ "$overall" -eq 0 ] || echo "::error::覆盖率门禁连续 2 次失败（含 OOM 边缘可能）—— 详见上方日志"
          exit $overall
      # 覆盖率缺口可见清单（2026-10-25）：把"红一次"变成"照着修"。
      # 只写 $GITHUB_STEP_SUMMARY（运行页直接可见，**不需要任何写权限**；
      # 不用 PR 评论是因为受限仓库的 `pull-requests: write` 常缺失、会让步骤白红）。
      - name: Coverage gaps (frontend)
        if: always()
        run: python3 scripts/coverage_gaps.py --istanbul frontend/coverage/coverage-final.json --out coverage-gaps-frontend.md --title "前端覆盖率缺口"
      - name: Upload coverage gaps (frontend)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-gaps-frontend
          path: coverage-gaps-frontend.md
          if-no-files-found: warn
          retention-days: 30
      - name: Report vitest failure
        if: failure()
        run: |
          LOG="$RUNNER_TEMP/vitest-coverage.log"
          # 日志文件由"Frontend tests + coverage"步骤开头创建；若它不存在，说明失败发生在
          # 更早的步骤（典型是依赖安装/类型检查），此时旧脚本会撞上 grep 的 ENOENT 再报一次
          # exit 1，把真因挤掉。这里显式区分。
          if [ ! -f "$LOG" ]; then
            echo "::error::vitest 未产生日志 —— 失败发生在本步骤之前（依赖安装 / vue-tsc / lint 阶段），请查看前置步骤日志"
            exit 1
          fi
          # 关键信号优先(annotation 上限 ~10 条，保留最先发出的)：先出硬失败信号
          # (覆盖率阈值不达 / OOM / ENOENT / 失败用例标记 / Test Files N failed 汇总)，
          # 不再匹配 ✓(299 行通过用例会刷屏挤掉真因)。
          echo "===== vitest hard-failure signal ====="
          grep -nE "ERROR: Coverage|does not meet|heap out of memory|FATAL ERROR|Reached heap limit|Allocation failed|Failed Tests|FAIL |AssertionError|Cannot find module|ENOENT|Test Files +[0-9]+ failed|Tests +[0-9]+ failed" "$LOG" | head -25 | sed 's/^/::error::/' || true
          echo "===== coverage rows below 100 ====="
          # 仅匹配覆盖率表格行(token 后跟可选空白再跟 `|`)，排除 `List.test.ts (63 tests)`
          # 这类通过用例结果行(含 `.ts ` 但无 `|`)——旧模式会刷屏挤掉真因(annotations 上限 ~10)。
          grep -E "(\.vue|\.ts|All files)[[:space:]]*\|" "$LOG" | grep -vE "\|[[:space:]]*100[[:space:]]*\|[[:space:]]*100[[:space:]]*\|[[:space:]]*100[[:space:]]*\|[[:space:]]*100" | head -30 | sed 's/^/::error::/' || true
          # 2026-10-06 追加：三轮失败（ffdbf76/1e08ea3/a317a99）的报错都未被上述模式覆盖
          # （exit 1、早期退出、日志里无 FAIL/heap/阈值行）——job log API 需认证(401)、
          # 网页是 JS 渲染，注解是本仓库免认证唯一可读通道（每步上限 ~10 条、单条 ≤4096 字符）。
          # c69bdfe5 轮已确认真凶形态：「Vitest caught 1 unhandled error —— TypeError:
          # ... reading 'stopPropagation'」且覆盖率表已全 100（门禁本身通过）。
          # 这里优先把 Unhandled Errors 的完整堆栈注解化（直接定位文件:行）：
          echo "===== unhandled error stack ====="
          grep -aA 16 "Unhandled Errors" "$LOG" | grep -avE "^[0-9]+[-:]\s*$" | head -14 | cut -c1-380 | sed 's/^/::error::/' || true
          echo "===== generic error lines ====="
          grep -naE "Error:|Unhandled|error during|exited with|EADDR|ENOSPC|ENOMEM|RangeError|TypeError" "$LOG" | tail -3 | cut -c1-380 | sed 's/^/::error::/' || true
          exit 1
      - name: Upload vitest log
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vitest-coverage-log
          path: ${{ runner.temp }}/vitest-coverage.log
          if-no-files-found: ignore
          retention-days: 7
      # 上传覆盖率到 Codecov
      - uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4
        with:
          directory: frontend
          flags: frontend
          fail_ci_if_error: false
        continue-on-error: true

  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: '3.11' }
      # mypy 固定版本（2026-10-27 v1.18.17）：技术债棘轮把 mypy 错误数**当基线守住**，
      # 不 pin 的话上游发新版换个检查规则就能让计数整体漂移 —— 要么假红、要么假绿。
      # 1.19.1 与 backend/requirements-dev.txt 及本地基线测量口径一致；
      # 升级 mypy 必须同步 `python scripts/check_type_debt.py --update` 并说明理由。
      - run: pip install flake8 "mypy==1.19.1" bandit
      # flake8 零错误门禁
      - run: cd backend && python -m flake8 app/ --max-line-length=120 --count --max-complexity=16
      # 运维脚本同一口径零错误门禁。复杂度阈值放宽到 40：scripts/ 下多为一次性
      # 流程脚本（清理/打包审计/分段测试执行器），main() 天然较长；其余规则
      # （未用导入、重复导入、空行、EOF 换行、行内换行运算符等）与 app/ 一致。
      # scripts/archive/ 为已归档的一次性迁移脚本，与仓库根 .flake8 的 exclude 保持一致。
      - run: cd backend && python -m flake8 ../scripts/ --max-line-length=120 --count --max-complexity=40 --exclude ../scripts/archive
      # mypy 类型检查（非阻断，但报告类型问题）
      - name: mypy type check
        run: cd backend && python -m mypy app/ --config-file=mypy.ini --ignore-missing-imports || true
      # 技术债棘轮门禁（阻断）：mypy 错误数 / 前端 `as any` 处数 / 后端宽泛
      # `except Exception` 处数，三者任一超过 .type-debt-baseline.json 即失败。
      # 背景（2026-10-27 体检）：mypy 1393 errors / 150 files 一直是 `|| true`
      # 永不阻断，`as any` 196 处与 `except Exception` 802 处也无任何上限 ——
      # 三类债只会单向增长。一次性清零等于给全库补类型标注，不现实；但
      # "不允许继续恶化"可以立刻做到。下调基线直接改小；上调需 PR 说明理由。
      - name: Type debt ratchet (mypy / as any / broad except)
        run: cd backend && python ../scripts/check_type_debt.py
      # bandit 安全扫描（低级别，阻断）
      - name: bandit security scan
        run: cd backend && python -m bandit -r app/ -ll

  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: '3.11' }
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with: { node-version: '22' }
      # 后端依赖漏洞扫描（pip-audit）
      - run: pip install pip-audit pip-licenses
      - name: Backend dependency audit
        run: pip-audit -r backend/requirements.txt
        continue-on-error: true  # 依赖漏洞提示, 不阻断合并/构建
      # 前端依赖漏洞扫描
      # 2026-10-03 校正：旧写法 `npm audit --audit-level=high` 把 devDependencies 的漏洞
      # 一并作为阻断项。当时唯一命中是 braces GHSA-vfj7-8cjw-p6xm（CVE-2026-93687，
      # 受影响 ≤3.0.3，官方 advisory「Patched versions: None」，overrides 无解），
      # 命中链 braces→micromatch→fast-glob→globby→@typescript-eslint/*、chokidar→braces，
      # 全部只存在于 devDependencies（实测 `npm ls braces --omit=dev --all` 输出为空）。
      # 以「无上游修复版本的开发期依赖」阻断合并，等于把门禁变成永久红灯，反而掩盖真实
      # 的生产依赖风险。因此：阻断门禁收敛到生产依赖树（--omit=dev），全量审计改为
      # 非阻断并留存 JSON artifact —— 可见性不降低，阻断语义回到「真实可修的生产风险」。
      - name: Frontend dependency audit (production tree, blocking)
        run: |
          cd frontend
          # npm audit 只读已提交的 package-lock.json + registry advisory 库，
          # 无需安装 node_modules——原步骤里的 `npm install --legacy-peer-deps`
          # 是 security 作业唯一的网络抖动源（两次瞬时失败），移除之。
          npm audit --omit=dev --audit-level=high
      - name: Frontend dependency audit (full tree, report only)
        continue-on-error: true
        run: |
          cd frontend
          npm audit --json > npm-audit-full.json
      - name: Upload full npm audit report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm-audit-full
          path: frontend/npm-audit-full.json
          if-no-files-found: ignore
          retention-days: 7
      # 生成 SBOM（许可证清单），作为 artifact 上传供军口许可证白名单审查
      - name: Generate SBOM (license list)
        run: |
          pip-licenses --from=mixed --with-system --with-description --format=csv --output-file=sbom.csv || true
      - name: Upload SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom-license-list
          path: sbom.csv
          if-no-files-found: warn

  static-analysis:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: '3.11' }
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with: { node-version: '22' }
      # 版本一致性门禁：sync-version.js --check 检测 13 处版本号漂移
      # 软删除过滤静态扫描：新增对软删模型的无 is_active 聚合/列表查询即失败
      - name: Soft-delete filter guard
        run: python backend/scripts/check_soft_delete_usage.py
      # 分页硬上限（2026-10-25）：page_size 必须写 le=MAX_PAGE_SIZE。
      # 离线单机里无上限不是"慢一点"——一次实例化上千 ORM 对象（含加密 PII 列），
      # Electron 侧拿到超大 JSON 会卡死，现场表现是"点一下列表就白屏"。
      # 排查时发现 4 处裸 `page_size: int = 20` 与 1 处 le=500，本门禁防复发。
      - name: Pagination cap guard
        run: python backend/scripts/check_pagination_cap.py --root backend
      # 办公文档格式门禁（WPS 兼容，2026-10-26）：导入必须走统一读取层
      # （直连 openpyxl 会让 .xls / WPS 旧版 .et 静默失败）、白名单必须出自
      # office_formats（新增 .et 漏改就被拒）、导出仅允许 xlsx/csv/docx/pdf、
      # CSV 必须带 UTF-8 BOM（否则 WPS/Excel 中文乱码）。
      # 运行时夹具自检在未装依赖的 CI static-analysis 里自动跳过（pytest 覆盖）。
      - name: Office formats (WPS) guard
        run: python scripts/check_office_formats.py
      # P-1/P-2/P-3 预防性棘轮门禁（遗留风险治理计划 2026-09-13）：
      # os._exit 绕 lifespan / subprocess text=True 缺 encoding / rmtree 后缺
      # dirs_exist_ok 的 copytree / ZIP 与上传无界读取 / 上传端点未限长 /
      # 裸 threading.Timer 未走 RecurringTimer。基线在 backend/scripts/gate_baselines/
      # （棘轮只紧不松：清理完历史豁免后基线应趋向空文件）。
      - name: P1/P2/P3 prevention ratchets
        run: |
          python backend/scripts/check_os_exit.py
          python backend/scripts/check_subprocess_encoding.py
          python backend/scripts/check_dir_replace.py
          python backend/scripts/check_unbounded_read.py
          python backend/scripts/check_upload_endpoints.py
          python backend/scripts/check_scheduler_registration.py
      # 原始 SQL f-string 豁免门禁（2026-10-17）：`text(f"...")` 必须带
      # `# nosec B608 - <理由>`。用 AST 定位完整语句范围（多行 f-string
      # 内含 SQL 括号也不会误判）；理由写在语句范围外不算。配套单测
      # backend/tests/unit/test_raw_sql_fstring_gate.py 钉死仓库零违规。
      # W18 防腐门禁（2026-10-17）：
      #  - check_unused_scope_params：作用域形参收下却从未使用（P0-2 "看起来
      #    已隔离、实际没隔离"的最危险形态）
      #  - check_userdata_path_consistency：Electron userData / NSIS 钩子 /
      #    backend paths.py 三处目录口径漂移（漂移只在卸载时才暴露）
      - name: W18 anti-drift gates
        run: |
          python scripts/check_unused_scope_params.py
          python scripts/check_userdata_path_consistency.py
      # W25（2026-10-20）：裸 dict 返回棘轮门禁（CONTEXT.md 不变量 3 envelope 契约）。
      # 历史状态：旧实现在**两个层面**失效 ——
      #   ① 扫描路径拼成 backend/scripts/app/api/v1（目录不存在）→ 恒报 0；
      #   ② 单行正则只认 `return {` 同行形态，跨行裸 dict 漏判。
      # 实测审批模块当时有 19 处裸 dict 而门禁全绿，且该脚本从未被任何 workflow 调用。
      # 现改为 AST 判定 + 棘轮基线（backend/scripts/gate_baselines/bare_returns_baseline.json）：
      # 只允许持平或减少，新增即为 NEW>0 失败。
      - name: Bare dict return ratchet (envelope contract)
        run: |
          python backend/scripts/scan_bare_returns.py \
            --baseline backend/scripts/gate_baselines/bare_returns_baseline.json
      - name: Raw SQL f-string exemption guard
        run: python scripts/check_raw_sql_fstrings.py
      # W27（2026-10-23）：同步链覆盖率门禁 —— 防「新表忘了进同步链」再次发生。
      # W26-P0-6 的根因：`data_reports`（上报台账）不在任何同步链，
      # 多机部署下上级机永远收不到下级上报；**不报错、不变红**，靠人工维护两张
      # 清单迟早再漏。本门禁要求每张「跨机业务表」至少出现在一条同步链，
      # 或有**实际接线**的特殊通道（如台账的规范化导出/导入函数）。
      - name: Sync chain coverage gate
        run: python backend/scripts/check_sync_coverage.py
      # W27（2026-10-23）：零断言测试棘轮门禁 —— 防"空壳测试"重新长出来。
      # 起因：`tests/test_approval_idempotency.py` 的 10 个测试函数体全是 `pass`，
      # 让"审批幂等"看起来有覆盖；重写当轮立刻挖出「重复提交产生 2 条待审批任务」
      # 的真实缺陷。空壳测试比没有测试更糟 —— 它制造虚假安全感，还会让覆盖率变绿。
      # 基线 backend/scripts/gate_baselines/no_assert_tests_baseline.json，只减不增。
      - name: Zero-assertion test ratchet
        run: python backend/scripts/check_no_assert_tests.py
      - name: Version consistency check
        run: node scripts/sync-version.js --check
      # 前后端菜单对齐门禁：前端菜单 key/path 与后端 MENU_DEFINITIONS/前端路由一致
      - name: Menu alignment check
        run: python scripts/check_menu_alignment.py
      # console Tab 映射完整性：后端 menus.py 的每个 console tab 必须在前端
      # SystemConsole.vue 的 TAB_COMPONENTS 有组件映射（否则聚合页静默隐藏该功能，
      # 如 2026-10-21 发现的 R33 单位授权两个 tab 不可见）
      - name: Console tab mapping check
        run: python scripts/check_console_tab_mapping.py
      # 错误文案泄漏门禁：禁止把 axios 技术原文（Request failed with status code 4xx）
      # 直接展示给用户 —— 必须走 getErrorMessage()。缘起 2026-10-25 用户反馈界面出现
      # "Request failed with status code 422"：后端 422 返回英文数组 detail 且回显 input，
      # 前端多处 ElMessage.error(error.message) 把原文抛给用户。
      # 纯标准库扫描 frontend/src，无需安装依赖，故放在本作业。
      - name: Error message leak check
        run: python scripts/check_error_message_leaks.py
      # 后端综合安全审计：裸 db.commit()、跨组织删除、缺 ok_list/write_work_log/filter_by_data_scope
      - name: Backend comprehensive security audit
        run: python scripts/security_audit.py --verbose
      # 更新日志时效性门禁：当前 package.json 版本必须已在 CHANGELOG 记录，
      # 且最近 3 个版本段格式规范（x.y.z / 日期非未来 / 非空 / 严格降序）。
      # 缘起：v1.18.1 交付当日代码与发布都改了，更新日志漏记 4 条最贵的踩坑
      # （E2E 选择器失效、Release 正文 0 字符、Windows runner 上 shell 崩溃、哈希写死必过期）。
      # 纯标准库 + 只读 package.json，故放在本作业（无需安装 backend 依赖）。
      # 生产代码禁止 print（2026-10-28）：桌面端无控制台窗口，print 输出用户与排障都看不到；
      # 允许项仅 2 处（main.py 启动横幅 / logging_config handler 关闭兜底）。
      - name: No-print guard (logging single exit)
        run: python scripts/check_no_print.py
      - name: Changelog freshness check
        run: python scripts/check_changelog.py
      # 应用内更新日志一致性门禁：backend/app/services/version_history_data.py 必须由
      # CHANGELOG.md 生成且完全一致。缘起：应用内更新日志曾由硬编码列表驱动，与 CHANGELOG
      # 各写各的，长期停在 1.1.1（落后 17 个小版本），用户升级后看到的仍是旧说明。
      - name: In-app update log sync check
        run: python scripts/check_update_log.py
      # 全仓损坏扫描门禁（mojibake 双编 / NUL 空字节 / 非 UTF-8）：
      # 历史事故——backend/scripts/migrate_to_encrypted.py 被 sourcemap 与 3256 个 NUL
      # 覆盖，CodeCheck 的 flake8 阶段直接 ValueError，流水线整体 FAILURE；.gitignore
      # 本身也曾在 2026-10-24 被写成 GBK 双编，把 logs/ 与 _*.ps1 两条规则"粘"进注释。
      # 纯标准库 + git，故放在本作业；本机 pre-commit 钩子依赖 `python` 在 PATH
      # （本机没有），CI 才是这类守卫唯一可靠的执法点。
      - name: Repository corruption scan (mojibake/NUL/non-UTF8)
        run: python scripts/scan_mojibake.py --check
      # Alembic 迁移健康门禁：单 head、无分叉（防再发 4c1ea8a0 MultipleHeads 打包启动失败）
      - name: Alembic migration health check
        run: |
          pip install alembic
          python scripts/check_migrations.py
      # F2 覆盖率豁免 ratchet：新增/修改行的 `# pragma: no cover` 必须同行注明理由
      # （配套约定 F2 条）。存量裸 pragma 不阻断，但设上限防"边清理边新增"抵消；
      # 基线自动解析（origin/main → HEAD~1）；--deepen 让浅克隆也拿到父提交，
      # 无基线时显式告警而非静默通过。
      # 2026-10-06 起仓库裸 pragma 已清零（127→0），上限从 130 收紧到 0：
      # 任何人再写无理由豁免，此处直接红（配套单测 test_repo_bare_pragmas_stay_zero）。
      # 注意：说明注释必须放在命令起始行之前，不能插进反斜杠续行中间
      # （否则续行拼接后参数行会被当成独立命令执行 → exit 127）。
      - name: Coverage-exemption reason ratchet (F2)
        run: |
          git fetch --no-tags --deepen=50 origin main || true
          python scripts/check_pragma_reasons.py --diff-base auto \
            --allow-missing-base --max-bare 0

  # R35 三层对齐门禁（2026-10-24）：前端接口层 ↔ 后端路由/Pydantic ↔ 数据库 schema。
  # 防"单测绿、真机废"的契约漂移（v1.17.2 的 /api/v1/system/self-check 恒 404、
  # OrganizationCreate 漏 code 字段即此类 —— 单测用 MagicMock 传 data 不会暴露）。
  #
  # 为什么必须独立作业：门禁要 import app.main（fastapi/sqlalchemy/pydantic）并用
  # alembic 起临时库，因此需要后端运行期依赖；而 static-analysis 作业只装了 alembic
  # 与几个 lint 工具，放在那里会因 ModuleNotFoundError 恒红（实测 EXIT=2）。
  # B 轴基线是"临时空库 + alembic upgrade head"，不读本机开发库，CI 与本地一致。
  stack-alignment:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: '3.11' }
      - run: pip install -r backend/requirements.txt
      - name: Stack alignment check (frontend/backend/database)
        working-directory: backend
        run: python ../scripts/check_stack_alignment.py
      # 路由认证覆盖门禁：`api_v1_router` 没有全局认证依赖，每个路由必须自己声明
      # `Depends(get_current_user)`。少写一行就是越权入口，且 code review 很难发现。
      # 用 FastAPI 运行时依赖树递归判定（能识别经角色守卫间接要求认证的路由），
      # 白名单外的无认证路由即失败。2026-10-28 首次上线时逐个核查了 58 个无认证
      # 路由，全部有合理设计或其它保护（机器码双码 + loopback、备份自定义认证、
      # 初始化前无用户等），详见 scripts/check_route_auth.py 的白名单注释。
      - name: Route auth coverage gate
        working-directory: backend
        run: python ../scripts/check_route_auth.py
      # 文档数字漂移门禁：CLAUDE.md 里的 API 端点数 / 路由模块数 / 前端测试文件数 /
      # 后端测试用例数必须与实测一致。缘起（2026-10-26 体检）：文档写"14,726 用例"，
      # 实测 14,731→14,757，而这行数字此前**从未接进 CI**，只有人手工跑 --full 才发现，
      # 于是"文档说它是门禁"与实际"没人执行"长期并存。
      # --full 会 `pytest --collect-only` 并 import app.main，必须有后端运行期依赖，
      # 因此放在本作业（static-analysis 只装了 alembic 与 lint 工具，见上方注释）。
      - name: Doc number drift check
        run: python scripts/check_doc_numbers.py --full

  # 升级排练（P0-8，2026-10-17）：用最近**发布标签**的旧代码在临时库上建出"老用户库"，
  # 每张表播一行，再用当前代码 upgrade head，校验"表集合不丢 / 行数不变 / 完整性 ok /
  # 落在当前 head"。安装包冒烟只证明"能装能起"，证明不了"老用户的库升级后数据还在"——
  # 这段过去靠人工在测试机点，漏做即现场事故（打包环境没有回退路径）。
  upgrade-rehearsal:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0   # 需要完整 tag 历史来定位"上一个发布版本"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: '3.11' }
      - run: pip install -r backend/requirements.txt
      - name: Rehearse upgrade from the latest release tag
        working-directory: backend
        run: python scripts/upgrade_rehearsal.py

  # E2E 浏览器套件（Playwright，150 用例）：真实起后端(18000)+前端(15173)，
  # 独立 e2e_test.db。此前长期无 CI 执行导致选择器/密码腐化四周无人发现
  # （2026-09-06 R8 复活），纳入门禁防再腐化。Linux 用 chromium（config 按
  # 平台切换，Windows 本地用系统 Edge）。
  e2e-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60   # 依赖安装 + Playwright chromium + 150 用例
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: '3.11' }
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          # v1.14.3：缓存 ~/.npm，网络抖动时配合 --prefer-offline 可完全命中缓存
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      # 后端依赖（webServer 直接 python -m uvicorn 启动，无 venv）
      - run: pip install -r backend/requirements.txt
      # 前端依赖 + Playwright chromium 浏览器（config 在 Linux 用 chromium）
      # 网络抖动治理（2026-10-06）：此处原为裸 `npm ci` + 裸 `playwright install` ——
      # 2026-10-06 的 5b63d72 运行即因本步骤失败（同一批次里带重试的 frontend-check
      # 反而通过），而失败形态只有一个"Run cd frontend"步骤名，真因被完全掩盖。
      # 与 frontend-check 保持同款：提高 fetch 重试/超时 + 外层 3 次幂等重试。
      # 2026-10-28（v1.18.24）：同 frontend-check，带 restore-keys 的 ~/.npm 缓存
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-
      - name: Install frontend deps and Playwright browser
        run: |
          cd frontend
          npm config set fetch-retries 5
          npm config set fetch-retry-mintimeout 20000
          npm config set fetch-retry-maxtimeout 120000
          npm config set fetch-timeout 300000
          npm cache verify || true
          # 2026-10-28（v1.18.24）：与 frontend-check 同款镜像兜底 —— 默认 registry 整段
          # ECONNRESET 时（本仓实测同一 commit 重跑两次仍红）改用镜像再试，避免 E2E 作业
          # 因下载依赖失败而阻断整轮 PR Checks（进而阻断 tag 发布的 release gate）。
          MIRROR="https://registry.npmmirror.com"
          # 首试：完全离线（只吃 ~/.npm 缓存）。缓存命中时**零网络**即可安装 ——
          # 这是 registry 整段不可达时唯一还能出包的路径；未命中会秒失败，不影响后续在线重试。
          if npm ci --legacy-peer-deps --offline --no-fund --no-audit; then
            echo "npm ci OK (offline cache)"
          else
          for i in 1 2 3 4 5; do
            echo "===== npm ci attempt $i (default registry) ====="
            if npm ci --legacy-peer-deps --prefer-offline --no-fund --no-audit; then
              echo "npm ci OK (attempt $i)"
              break
            fi
            if [ "$i" = "5" ]; then
              echo "::warning::默认 registry 连续 5 次失败，改用镜像 $MIRROR"
              npm ping --registry "$MIRROR" || echo "::warning::npm ping 镜像失败（继续尝试）"
              INSTALLED=0
              for j in 1 2 3; do
                if npm ci --legacy-peer-deps --no-fund --no-audit \
                     --registry "$MIRROR" --replace-registry-host=always --loglevel=http; then
                  echo "npm ci OK via mirror (attempt $j)"; INSTALLED=1; break
                fi
                sleep $((j * 20))
              done
              if [ "$INSTALLED" != "1" ]; then
                echo "::warning::镜像 ci 也失败，回退 npm install --prefer-offline"
                npm install --legacy-peer-deps --no-fund --no-audit --prefer-offline || {
                  echo "::error::npm ci/npm install 连续失败（默认源与镜像均失败）"
                  exit 1
                }
              fi
              break
            fi
            echo "npm ci attempt $i failed; retrying in $((i * 20))s"
            sleep $((i * 20))
          done
          fi
          for i in 1 2 3; do
            echo "===== playwright install attempt $i ====="
            if npx playwright install chromium --with-deps; then
              echo "playwright install OK (attempt $i)"
              exit 0
            fi
            echo "playwright install attempt $i failed; retrying in $((i * 30))s"
            sleep $((i * 30))
          done
          echo "::error::playwright install 连续 3 次失败 —— 疑似浏览器下载源/apt 镜像故障，非业务代码问题"
          exit 1
      - name: E2E tests (Playwright)
        run: |
          cd frontend
          npx playwright test --reporter=line
      - name: Upload E2E report on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  # R13（遗留风险治理计划 2026-09-12）：Windows 专属缺陷的 CI 可见性。
  # 背景：以上作业全部跑在 ubuntu-latest，而 Windows 编码（GBK 管道解码）、
  # 文件句柄占用、路径分隔符类缺陷**只能本地撞见**——v1.12.3 Windows 出包
  # 编码崩溃、v1.12.6 subprocess.run(text=True) GBK 管道 3 例失败均为同类
  # 先例（Linux CI 全绿、本地必红）。此作业以 windows-latest 跑"编码/句柄
  # 敏感子集"+ lint，把缺陷提前到 PR 阶段暴露。
  # 前置 PYTHONUTF8/PYTHONIOENCODING 统一 UTF-8，避免 runner 默认 GBK 造成
  # 与产品无关的假失败。
  windows-smoke:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: '3.11' }
      # Electron 外壳单测同样在 Windows 上跑：path-guard.js 是**路径语义敏感**模块
      # （大小写、分隔符、盘符、UNC、`..` 规范化），Linux 全绿不代表 Windows 正确 ——
      # 这正是本作业存在的理由（v1.12.3 编码崩溃、v1.12.6 GBK 管道均为"Linux 绿、Windows 红"）。
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
      - name: Electron shell unit tests (Windows)
        run: npm run test:electron
      - run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      # 编码/句柄/路径敏感子集：管道解码、打包产物校验、备份路径、
      # 数据同步路由、帮扶村上传——历史上全部在 Windows 端暴露过问题
      - name: Windows-sensitive test subset
        run: |
          cd backend
          python -m pytest tests/unit/test_pragma_reason_ratchet_f2.py tests/unit/test_verify_package_no_tests_v123.py tests/unit/test_backup_path_alignment.py tests/unit/test_data_sync_route.py tests/unit/test_supported_village_api.py -q --tb=short
      # 与 Linux lint 作业同口径（含 C901 复杂度上限）
      - name: Lint (app/)
        run: cd backend && python -m flake8 app/ --max-line-length=120 --count --max-complexity=16
