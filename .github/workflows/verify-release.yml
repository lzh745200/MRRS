name: Verify Published Release

# 发布后资产完整性校验（2026-11-20）
# ---------------------------------------------------------------------------
# 为什么需要：构建期的 `verify_release_assets.py` 只校验「本地产物 vs 清单」，
# 跑在**上传之前**。上传阶段仍可能残缺 —— v1.18.15 实测因 electron-builder 与
# softprops 的 publish 竞态，`latest.yml` 与 `.exe.blockmap` 被 skipped，Release
# 只剩 6 个资产，而构建是绿的。这类问题此前只能靠人眼看 Release 页面发现。
#
# 本工作流在发布之后从 GitHub API 侧核对：资产齐全、非空、latest.yml 的
# version/path/size 一致、三份 SHA256SUMS 与 GitHub 记录的 asset digest 逐项吻合。
# 不下载 380MB 安装包 —— GitHub 的 digest 就是存储层字节的 sha256。
#
# 触发时机说明：`release: published` 在**第一个**上传作业把 Release 从 draft 转正
# 时触发，此时 ARM64 作业可能仍在传资产。故脚本带 `--wait` 轮询（默认 30 分钟），
# 只在「缺资产 / 0 字节」时重试，其它问题（draft、哈希不符）立即失败。

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: '要校验的发布标签（如 v1.18.53）'
        required: true
        type: string
      wait_seconds:
        description: '等待资产齐全的最长秒数（0 = 不等待）'
        required: false
        default: '0'
        type: string

permissions:
  contents: read

concurrency:
  group: verify-release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: '3.11' }

      # tag 通过 env 传入、不在 shell 里内联展开：tag 名可含 ; $() 等字符
      # 只跑一次：`--json` 报告 tee 到文件供 artifact；`pipefail` 保证脚本非 0 时
      # 步骤真的失败（否则管道退出码会被 tee 吃掉）。重复执行会让等待期翻倍。
      - name: Verify release assets (completeness + digests)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
          WAIT_SECONDS: ${{ inputs.wait_seconds || '1800' }}
        run: |
          set -euo pipefail
          echo "校验 Release: $RELEASE_TAG（等待上限 ${WAIT_SECONDS}s）"
          python scripts/verify_published_release.py \
            --tag "$RELEASE_TAG" --wait "$WAIT_SECONDS" --json | tee verify-report.json

      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-verify-report
          path: verify-report.json
          retention-days: 90
          if-no-files-found: warn
