name: Nightly Full Test Suite

on:
  schedule:
    - cron: '0 2 * * *'  # 每天凌晨 2:00 UTC
  workflow_dispatch:

permissions:
  contents: read

# 并发组（R28 低危清理）：只避免同一工作流在同一 ref 上叠加运行 ——
# backend-full 90 分钟预算是正常耗时（AGENTS.md：不要取消它），
# 因此 cancel-in-progress: false（新触发排队等待，绝不取消进行中的全量回归）。
concurrency:
  group: nightly-full-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  backend-full:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: '3.11' }
      - run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - name: Full test suite with coverage
        run: |
          cd backend
          # 2026-08-24：改用 xdist 并行（对齐 PR Checks 已验证配方），
          # 全量约 15-20 分钟完成；单进程模式需 60-90 分钟，
          # 曾三次被外部协调取消（runs #10/#11/#12）。
          # 覆盖率门禁：阈值统一由 backend/.coveragerc 的 fail_under=100 单一承载
          # （2026-09-04 对齐 #21：移除内联 --cov-fail-under=98——命令行参数会
          #  屏蔽配置文件口径，此前 nightly 实际跑的是 98 旧门禁）
          # 2026-10-17：加 -rR 并 tee 到日志 —— 抖动账本需要逐条 RERUN 清单
          # （JUnit XML 不记录 rerun，实测 pytest-rerunfailures 15.0）。
          LOG="$RUNNER_TEMP/pytest-nightly.log"
          set -o pipefail
          python -m pytest tests/ -q --tb=line \
            -n auto -rR \
            --cov=app --cov-report=html --cov-report=json --cov-report=xml \
            --reruns 2 --reruns-delay 1 \
            --durations=20 \
            --junitxml=test-results.xml 2>&1 | tee "$LOG"
      # 抖动账本（2026-10-17）：nightly 是唯一"每天全量"的观察窗口，抖动趋势在此累积。
      # 告警阈值 3、硬上限 10（超过 10 次说明不是个别用例，而是系统性不确定性）。
      - name: Flaky test ledger
        if: always()
        run: |
          python scripts/ci_flake_report.py --log "$RUNNER_TEMP/pytest-nightly.log" \
            --out flaky-report.txt --warn-reruns 3 --max-reruns 10
      - name: Upload flaky ledger
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: flaky-ledger-nightly
          path: flaky-report.txt
          if-no-files-found: warn
          retention-days: 90
      - name: Upload test results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: backend-test-results
          path: backend/test-results.xml
      - name: Upload coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: backend-coverage-html
          path: backend/htmlcov/
      - uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4
        with:
          directory: backend
          flags: backend-nightly
        continue-on-error: true

  frontend-full:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Node 22（与仓库其余 CI 一致）。LoginEnhanced.vue 全量 functions 88.23% 的真因不是 Node
      # 版本（曾误诊升 24，Node24 CI 复现相同 88.23%/f42ae680），而是 istanbul 按 id 合并冲突的 v8
      # fnMap——该 .vue 被两个测试以不同 ElDialog 桩深挂载。已移除 AuthViewsBatch.test.ts 的冗余
      # bare 渲染根治（每个 .vue 只由一个测试深挂载）。详见 frontend/vitest.config.ts 注释 (A)。
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with: { node-version: '22' }
      # npm ci 严格按 lockfile 安装（与 pr-checks 一致），保证 nightly 与 PR 结果可复现。
      # 网络抖动治理（2026-10-06）：此处原为裸 `npm ci`，未移植 pr-checks 的加固 ——
      # 一次 ECONNRESET 即让 npm ci 失败、vitest 压根没跑，nightly 呈现"红但无信息"，
      # 白白丢掉夜间回归的发现能力（2026-10-05 实际发生）。与 pr-checks.yml 保持同款：
      # ① 提高 fetch 重试与超时；② 外层 3 次幂等重试；③ 连续失败时给出明确 ::error::。
      - name: Install frontend dependencies
        run: |
          cd frontend
          npm config set fetch-retries 5
          npm config set fetch-retry-mintimeout 20000
          npm config set fetch-retry-maxtimeout 120000
          npm config set fetch-timeout 300000
          for i in 1 2 3; do
            echo "===== npm ci attempt $i ====="
            if npm ci --legacy-peer-deps; then
              echo "npm ci OK (attempt $i)"
              exit 0
            fi
            echo "npm ci attempt $i failed; retrying in 10s"
            sleep 10
          done
          echo "::error::npm ci 连续 3 次失败 —— 疑似 registry 网络故障或 package-lock 不一致，非业务代码问题"
          exit 1
      # W24（v1.15.5）：与 pr-checks 的 frontend-check 同口径 —— 单进程 v8 覆盖率在
      # 7GB runner 上贴内存悬崖（历史上被 OS 硬杀、日志无错误信号），因此同样压低
      # V8 堆上限，并保留一次整门禁重试；否则 nightly 只剩"红但无信息"。
      - name: Full test + coverage
        env:
          NODE_OPTIONS: --max-old-space-size=5632
        run: |
          cd frontend
          LOG="$RUNNER_TEMP/vitest-nightly.log"
          : > "$LOG"
          set -o pipefail
          overall=1
          for attempt in 1 2; do
            echo "===== coverage attempt $attempt =====" | tee -a "$LOG"
            if npx vitest run --coverage --reporter=junit --outputFile=test-results.xml 2>&1 | tee -a "$LOG"; then
              overall=0
              break
            fi
            echo "attempt $attempt 失败，15s 后重试" | tee -a "$LOG"
            rm -rf coverage
            sleep 15
          done
          [ "$overall" -eq 0 ] || echo "::error::nightly 前端覆盖率门禁连续 2 次失败（含 OOM 边缘可能）—— 详见上方日志"
          exit $overall
      - name: Upload vitest nightly log
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vitest-nightly-log
          path: ${{ runner.temp }}/vitest-nightly.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload test results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: frontend-test-results
          path: frontend/test-results.xml
      - name: Upload coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: frontend-coverage
          path: frontend/coverage/
      - uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4
        with:
          directory: frontend
          flags: frontend-nightly
        continue-on-error: true

  quality-report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [backend-full, frontend-full]
    if: always()
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Generate quality summary
        run: |
          echo "## 每日质量报告 ($(date +%Y-%m-%d))" > quality-report.md
          echo "" >> quality-report.md
          echo "| 检查项 | 状态 |" >> quality-report.md
          echo "|--------|------|" >> quality-report.md
          echo "| 后端测试 | ${{ needs.backend-full.result == 'success' && '✅' || '❌' }} |" >> quality-report.md
          echo "| 前端测试 | ${{ needs.frontend-full.result == 'success' && '✅' || '❌' }} |" >> quality-report.md
      - name: Upload quality report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: quality-report
          path: quality-report.md
