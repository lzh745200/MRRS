name: Build Self-Contained ARM64 Debian Package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: build-arm64-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-backend:
    name: Build ARM64 Backend Binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup QEMU (ARM64 emulation)
        uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4.1.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Pre-pull base image (ECR public fallback for EOL buster)
        run: |
          set -e
          IMG="public.ecr.aws/docker/library/python:3.11-slim-buster"
          for i in 1 2 3; do
            echo "attempt $i: pulling $IMG"
            if docker pull --platform linux/arm64 "$IMG"; then
              docker tag "$IMG" python:3.11-slim-buster
              break
            fi
            sleep 15
            if [ "$i" = 3 ]; then
              # 最终回退：直接尝试 Docker Hub 官方镜像（EOL 标签仍存在，仅匿名限流）
              docker pull --platform linux/arm64 python:3.11-slim-buster
            fi
          done

      - name: Build backend binary in ARM64 Debian Buster container
        run: |
          mkdir -p backend/dist
          docker buildx build \
            --platform linux/arm64 \
            --build-arg BASE_REGISTRY=public.ecr.aws/docker/library \
            --target output \
            -f docker/Dockerfile.backend-arm64 \
            --output type=local,dest=backend/dist \
            --pull=false \
            .

      - name: Verify backend binary
        run: |
          ls -lh backend/dist/assistance-backend
          file backend/dist/assistance-backend

      - name: Upload backend artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-arm64
          path: backend/dist/assistance-backend

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: |
          npm install --legacy-peer-deps --no-fund --no-audit

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build 2>&1  # stderr 重定向避免 GitHub Actions 误标失败注释

      - name: Upload frontend artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend-dist
          path: frontend/dist/

  build-electron-deb:
    name: Build Electron DEB Package
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install root dependencies (ARM64 cross-compile)
        run: |
          npm install --legacy-peer-deps --no-fund --no-audit
        env:
          npm_config_arch: arm64
          npm_config_target_arch: arm64

      - name: Install DEB packaging tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fakeroot dpkg-dev file
          echo "fakeroot: $(which fakeroot)"
          echo "dpkg-deb: $(which dpkg-deb)"

      - name: Download backend artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: backend-arm64
          path: ./downloaded/backend

      - name: Download frontend artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: frontend-dist
          path: ./downloaded/frontend

      - name: Prepare resources for electron-builder
        run: |
          # onedir 目录布局（ADR-0006）：extraResources from backend/dist/assistance-backend
          # upload-artifact v4 上传单目录时目录本身被剥离（内容在 artifact 根），
          # 因此这里重建 backend/dist/assistance-backend/ 结构
          mkdir -p backend/dist/assistance-backend
          cp -r downloaded/backend/. backend/dist/assistance-backend/
          # 结构守卫：布局不符时立即失败，避免把坏包打进 DEB
          test -f backend/dist/assistance-backend/assistance-backend || {
            echo "::error::onedir 产物结构异常（缺少 assistance-backend 主程序）"; ls -R downloaded/backend | head -20; exit 1; }
          test -d backend/dist/assistance-backend/_internal || {
            echo "::error::onedir 产物结构异常（缺少 _internal）"; exit 1; }
          # artifact zip 会丢失 exec 位，这里恢复（postinst 兜底再补一次）
          chmod +x backend/dist/assistance-backend/assistance-backend

          # Place frontend dist
          mkdir -p frontend/dist
          cp -r downloaded/frontend/* frontend/dist/

          # Verify resources
          echo "=== Backend binary ==="
          file backend/dist/assistance-backend/assistance-backend
          du -sh backend/dist/assistance-backend/_internal

          echo "=== Frontend dist ==="
          ls frontend/dist/ | head -5

          echo "=== Icon ==="
          ls -lh resources/icons/app-circle-256.png

      - name: Cache Electron binary
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: ${{ runner.os }}-electron-arm64-${{ hashFiles('package.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-arm64-

      - name: Syntax check Electron main process
        run: |
          for f in electron/*.js; do
            node --check "$f" || { echo "::error::Electron 语法检查失败: $f"; exit 1; }
          done
          echo "Electron 语法检查通过 ($(ls electron/*.js | wc -l) 个文件)"

      # 版本号与发布 tag 对齐（与 build-windows.yml:115 一致）——否则 Electron DEB
      # 产物永远使用仓库 package.json 的静态版本（历史 DEB 1.10.0 ≠ Setup 1.10.4 根因）
      - name: Sync version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: python scripts/sync_version.py "${GITHUB_REF_NAME#v}"

      - name: Build with electron-builder
        run: |
          echo "=== Pre-build debug ==="
          echo "Node: $(node -v)"
          echo "npm: $(npm -v)"
          echo "electron-builder: $(npx electron-builder --version)"
          echo "=== Files check ==="
          ls -lh backend/dist/assistance-backend/assistance-backend
          ls -lh backend/dist/assistance-backend/_internal | head -3
          ls -lh frontend/dist/index.html
          ls -lh resources/icons/app-circle-256.png
          echo "=== Building DEB ==="
          DEBUG=electron-builder npx electron-builder --linux deb --arm64 --publish never

      - name: Inject postinst script into DEB
        run: |
          DEB_FILE=$(ls dist/electron/*.deb | head -1)
          echo "Processing: $DEB_FILE"
          
          # Create temp directory for extraction
          mkdir -p deb_work
          cd deb_work
          
          # Extract .deb
          ar x "../$DEB_FILE"
          
          # Extract control archive
          mkdir -p DEBIAN
          tar xf control.tar.* -C DEBIAN/ 2>/dev/null || tar xf control.tar.gz -C DEBIAN/
          
          # ── 桌面集成载荷注入（开始菜单无图标根因修复，2026-09-10）──
          # electron-builder 的 linux.icon 仅 256x256，不满足其图标处理对
          # 512x512 下限的要求，生成的 DEB 可能不含 hicolor 应用图标，
          # 菜单项 Icon= 无法解析 → 开始菜单无图标；且 Linux 端从不创建
          # 桌面快捷方式。这里在重打包阶段把图标直接写入 DEB 载荷。
          DATA_MEMBER=$(ar t "../$DEB_FILE" | grep '^data\.tar' | head -1)
          mkdir -p data_root
          case "$DATA_MEMBER" in
            data.tar.zst) tar --zstd -xf "$DATA_MEMBER" -C data_root ;;
            data.tar.xz)  tar -Jxf "$DATA_MEMBER" -C data_root ;;
            data.tar.bz2) tar -jxf "$DATA_MEMBER" -C data_root ;;
            *)            tar -xf "$DATA_MEMBER" -C data_root ;;
          esac
          ICON_SRC="../resources/icons/app-circle-256.png"
          test -f "$ICON_SRC" || { echo "::error::图标源不存在: $ICON_SRC"; exit 1; }
          mkdir -p data_root/usr/share/pixmaps
          install -m 644 "$ICON_SRC" data_root/usr/share/pixmaps/assistance-management-system.png
          for size in 256 128 64 48 32 16; do
            mkdir -p "data_root/usr/share/icons/hicolor/${size}x${size}/apps"
            install -m 644 "$ICON_SRC" "data_root/usr/share/icons/hicolor/${size}x${size}/apps/assistance-management-system.png"
          done
          # 防御：electron-builder 生成的 .desktop 若 Icon= 非 executableName，
          # 按其实际 Icon 值再补一份，保证菜单项图标一定可解析
          DTFILE=$(find data_root/usr/share/applications -name '*.desktop' 2>/dev/null | head -1)
          test -n "$DTFILE" || { echo "::error::DEB 载荷缺少 .desktop 文件（electron-builder 打包异常）"; exit 1; }
          ICON_VAL=$(grep -m1 -E '^Icon=' "$DTFILE" | cut -d= -f2- | tr -d '\r' || true)
          if [ -n "$ICON_VAL" ] && [ "$ICON_VAL" != "assistance-management-system" ]; then
            for size in 256 128 64 48 32 16; do
              install -m 644 "$ICON_SRC" "data_root/usr/share/icons/hicolor/${size}x${size}/apps/${ICON_VAL}.png"
            done
          fi
          # 重打 data.tar.gz（统一 root 属主，dpkg 解包后文件归 root）
          tar czf data.tar.gz --owner=0 --group=0 --numeric-owner -C data_root .
          # 删除旧 control/data 成员（压缩格式可能是 gz/xz/zst，删除后
          # 统一追加新的 control.tar.gz + data.tar.gz；避免同名不同压缩
          # 格式共存导致 dpkg 出现双成员拒装。debian-binary 保持首位）
          for m in $(ar t "../$DEB_FILE" | grep -E '^(control|data)\.tar'); do
            ar d "../$DEB_FILE" "$m"
          done
          
          # Write postinst script
          cat > DEBIAN/postinst << 'POSTINST'
          #!/bin/bash
          set -e
          
          # Find install directory
          # 第二候选为 package.json productName（帮扶管理系统）的安装目录
          for dir in /opt/assistance-management-system "/opt/帮扶管理系统"; do
            if [ -d "$dir" ]; then
              # PyInstaller onedir 后端（ADR-0006）：backend/assistance-backend/{主程序,_internal/}
              if [ -f "$dir/resources/backend/assistance-backend/assistance-backend" ]; then
                chmod +x "$dir/resources/backend/assistance-backend/assistance-backend"
              fi
              # 兼容 onefile 旧布局
              if [ -f "$dir/resources/backend/assistance-backend.exe" ]; then
                chmod +x "$dir/resources/backend/assistance-backend.exe"
              fi
              # Ensure main binary is executable
              if [ -f "$dir/assistance-management-system" ]; then
                chmod +x "$dir/assistance-management-system"
              fi
              # Chromium SUID 沙箱（非 root 启动必需；dpkg 归档可能丢失 4755 权限）
              if [ -f "$dir/chrome-sandbox" ]; then
                chown root:root "$dir/chrome-sandbox" || true
                chmod 4755 "$dir/chrome-sandbox" || true
              fi
            fi
          done
          
          # Update desktop database
          if command -v update-desktop-database >/dev/null 2>&1; then
            update-desktop-database /usr/share/applications/ 2>/dev/null || true
          fi
          
          # Update icon cache
          if command -v gtk-update-icon-cache >/dev/null 2>&1; then
            gtk-update-icon-cache -f /usr/share/icons/hicolor/ 2>/dev/null || true
          fi
          
          # ── 桌面快捷方式（2026-09-10 修复：Linux electron-builder 从不创建
          # ~/Desktop 图标；安装目录需运行时发现——英文名/中文 productName 两种布局）
          ELECTRON_DIR=""
          for dir in /opt/assistance-management-system "/opt/帮扶管理系统"; do
            if [ -f "$dir/assistance-management-system" ]; then
              ELECTRON_DIR="$dir"
              break
            fi
          done
          
          mk_desktop_entry() {
            # $1=Exec 路径  $2=输出文件路径
            printf '%s\n' \
              "[Desktop Entry]" \
              "Version=1.0" \
              "Type=Application" \
              "Name=帮扶管理系统" \
              "Name[en]=Assistance Management System" \
              "Comment=乡村振兴综合管理平台" \
              "Exec=$1" \
              "Icon=assistance-management-system" \
              "Terminal=false" \
              "Categories=Office;Utility;" \
              "StartupNotify=true" > "$2"
          }
          
          apply_trusted() {
            # UKUI/麒麟桌面要求 .desktop 可执行且带信任标记，双击才不弹确认框
            if command -v gio >/dev/null 2>&1 && command -v sudo >/dev/null 2>&1; then
              sudo -u "$1" gio set "$2" metadata::trusted true 2>/dev/null || true
            fi
          }
          
          DESKTOP_CREATED=0
          if [ -n "$ELECTRON_DIR" ]; then
            for home_dir in /home/*; do
              [ -d "$home_dir" ] || continue
              user_name=$(basename "$home_dir")
              id "$user_name" >/dev/null 2>&1 || continue
              user_desktop=""
              if command -v xdg-user-dir >/dev/null 2>&1 && command -v sudo >/dev/null 2>&1; then
                user_desktop=$(sudo -u "$user_name" xdg-user-dir DESKTOP 2>/dev/null || true)
              fi
              if [ -z "$user_desktop" ] || [ ! -d "$user_desktop" ]; then
                for candidate in "$home_dir/Desktop" "$home_dir/桌面" "$home_dir/desktop"; do
                  if [ -d "$candidate" ]; then
                    user_desktop="$candidate"
                    break
                  fi
                done
              fi
              if [ -z "$user_desktop" ] || [ ! -d "$user_desktop" ]; then
                user_desktop="$home_dir/Desktop"
                mkdir -p "$user_desktop" 2>/dev/null || true
                chown "$user_name" "$user_desktop" 2>/dev/null || true
              fi
              if [ -d "$user_desktop" ]; then
                mk_desktop_entry "$ELECTRON_DIR/assistance-management-system" \
                  "$user_desktop/assistance-management-system.desktop"
                chmod 755 "$user_desktop/assistance-management-system.desktop" || true
                chown "$user_name" "$user_desktop/assistance-management-system.desktop" || true
                apply_trusted "$user_name" "$user_desktop/assistance-management-system.desktop"
                DESKTOP_CREATED=$((DESKTOP_CREATED + 1))
              fi
            done
          fi
          
          # SUDO_USER 兜底（/home/* 遍历无结果、用户 home 不在 /home 下等场景）
          if [ "$DESKTOP_CREATED" -eq 0 ] && [ -n "$SUDO_USER" ] && [ "$SUDO_USER" != "root" ] && [ -n "$ELECTRON_DIR" ]; then
            sudo_home=$(getent passwd "$SUDO_USER" 2>/dev/null | cut -d: -f6)
            if [ -n "$sudo_home" ]; then
              mkdir -p "$sudo_home/Desktop" 2>/dev/null || true
              if [ -d "$sudo_home/Desktop" ]; then
                mk_desktop_entry "$ELECTRON_DIR/assistance-management-system" \
                  "$sudo_home/Desktop/assistance-management-system.desktop"
                chmod 755 "$sudo_home/Desktop/assistance-management-system.desktop" || true
                chown "$SUDO_USER" "$sudo_home/Desktop/assistance-management-system.desktop" 2>/dev/null || true
                apply_trusted "$SUDO_USER" "$sudo_home/Desktop/assistance-management-system.desktop"
                echo "已为安装用户 $SUDO_USER 创建桌面快捷方式: $sudo_home/Desktop/assistance-management-system.desktop"
              fi
            fi
          fi
          
          # 刷新桌面数据库与图标缓存（菜单项/桌面图标立即可见）
          if command -v update-desktop-database >/dev/null 2>&1; then
            update-desktop-database /usr/share/applications/ 2>/dev/null || true
          fi
          if command -v gtk-update-icon-cache >/dev/null 2>&1; then
            gtk-update-icon-cache -f /usr/share/icons/hicolor/ 2>/dev/null || true
          fi
          
          exit 0
          POSTINST
          chmod 755 DEBIAN/postinst
          
          # Repack control archive（root 属主）
          tar czf control.tar.gz --owner=0 --group=0 --numeric-owner -C DEBIAN .
          
          # Repack .deb（data.tar.gz 已在前面注入图标并删除旧 data 成员）
          ar rcs "../$DEB_FILE" debian-binary control.tar.gz data.tar.gz
          cd ..
          rm -rf deb_work
          
          echo "postinst injected successfully"
          
          echo "=== 桌面集成载荷验证（图标 + .desktop 必须在包内）==="
          dpkg-deb -c "$DEB_FILE" | grep -E "usr/share/(pixmaps|icons/hicolor)/.*\.png" | head -5
          dpkg-deb -c "$DEB_FILE" | grep -E "usr/share/applications/.*\.desktop"

      - name: Verify DEB package
        run: |
          ls -lh dist/electron/*.deb
          file dist/electron/*.deb
      - name: DEB smoke (arch + glibc cap)
        run: |
          chmod +x scripts/verify_deb_smoke.sh
          bash scripts/verify_deb_smoke.sh dist/electron/*.deb
          # List contents to verify structure
          dpkg-deb -c dist/electron/*.deb | head -30

      # 产物 SHA256 清单（军队分发完整性链，W6-T5；命名区分产物族，避免同 Release 覆盖）
      - name: Generate SHA256SUMS
        run: |
          cd dist/electron
          sha256sum *.deb > SHA256SUMS-electron-deb-arm64.txt
          cat SHA256SUMS-electron-deb-arm64.txt

      - name: Upload DEB Package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kylin-arm64-deb
          path: |
            dist/electron/*.deb
            dist/electron/SHA256SUMS-electron-deb-arm64.txt
          if-no-files-found: error

      - name: Create Release (Electron DEB)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            dist/electron/*.deb
            dist/electron/SHA256SUMS-electron-deb-arm64.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── standalone 麒麟 DEB（无 Electron：后端 + Web，文档推荐装机方式）──
  # 2026-08-29 补齐：此前 CI 只构建 Electron DEB，而安装指南推荐 standalone DEB，
  # 用户只能本地 Docker 自行构建。现统一由 CI 构建并附到 Release。
  standalone-deb:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up QEMU (ARM64 emulation)
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Compute DEB version (strip v prefix, dpkg requires digit-leading)
        id: debver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build standalone Kylin DEB
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/Dockerfile.kylin-standalone
          platforms: linux/arm64
          outputs: type=local,dest=dist/deb
          push: false
          # DEB 内嵌版本号与发布 tag 对齐（Dockerfile ARG 默认 1.10.0，tag 触发时覆盖）
          build-args: |
            VERSION=${{ steps.debver.outputs.version }}
          # 禁用 --no-cache：QEMU 仿真下 layer 缓存是唯一提速手段（AGENTS.md 铁律）
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify standalone DEB (no CRLF in maintainer scripts)
        run: |
          # Dockerfile 最后 stage 为 FROM scratch AS output，COPY 保留 /output/ 前缀，
          # type=local 导出树为 dist/deb/output/*.deb
          DEB=$(ls dist/deb/output/*.deb | head -1)
          echo "Built: $DEB"
          file "$DEB"
          # 行尾治本验证：DEBIAN 维护脚本不得含 CR（2026-08-27 CRLF 事故回归门禁）
          rm -rf /tmp/debchk && mkdir -p /tmp/debchk
          dpkg-deb -R "$DEB" /tmp/debchk
          if grep -rl $'\r' /tmp/debchk/DEBIAN/ ; then
            echo "::error::DEB 维护脚本含 CRLF，将导致 postinst 无法执行"
            exit 1
          fi
          echo "维护脚本 LF 验证通过"
          bash -n /tmp/debchk/DEBIAN/postinst && echo "postinst 语法通过"
          bash -n /tmp/debchk/DEBIAN/prerm && echo "prerm 语法通过"
          bash -n /tmp/debchk/DEBIAN/postrm && echo "postrm 语法通过"
          # 桌面集成载荷断言（2026-09-10）：图标与 .desktop 必须在包内，
          # 缺失即出包失败，杜绝"安装后无图标/无快捷方式"静默出厂
          dpkg-deb -c "$DEB" | grep -E "usr/share/pixmaps/assistance-management-system\.png" \
            || { echo "::error::载荷缺少 pixmaps 图标"; exit 1; }
          dpkg-deb -c "$DEB" | grep -E "usr/share/icons/hicolor/512x512/apps/assistance-management-system\.png" \
            || { echo "::error::载荷缺少 hicolor 图标"; exit 1; }
          dpkg-deb -c "$DEB" | grep -E "opt/assistance-management-system/desktop/.*\.desktop" \
            || { echo "::error::载荷缺少 .desktop"; exit 1; }
          echo "桌面集成载荷断言通过"

      # 产物 SHA256 清单（W6-T5；命名区分产物族，避免同 Release 覆盖）
      - name: Generate SHA256SUMS
        run: |
          cd dist/deb/output
          sha256sum *.deb > SHA256SUMS-standalone-deb-arm64.txt
          cat SHA256SUMS-standalone-deb-arm64.txt

      - name: Upload standalone DEB
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kylin-arm64-standalone-deb
          path: |
            dist/deb/output/*.deb
            dist/deb/output/SHA256SUMS-standalone-deb-arm64.txt
          if-no-files-found: error

      - name: Create Release (standalone DEB)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            dist/deb/output/*.deb
            dist/deb/output/SHA256SUMS-standalone-deb-arm64.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
