name: Build Windows Installer (x64)

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  NODE_VERSION: '22'
  PYTHON_VERSION: '3.11'

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    # v1.13.1 发布门禁重构（根因修复）：tag 构建不再重复跑全量后端/前端测试。
    #   - 全量门禁的权威位置是 main 分支的 PR Checks（push main 即跑全量后端 + 前端 +
    #     分支覆盖率）与 Nightly；同一提交内容在那里已经跑过。tag 构建重复一遍不会
    #     产生新信息，反而因 flaky 测试/rerun 与覆盖率数据合并抖动随机变红 ——
    #     v1.13.0 的 Windows 发布失败即源于此（同代码同一 runner，PR Checks success、
    #     tag smoke 失败，且失败发生在后端步骤 14.5 分钟处）。
    #   - 本作业改为「发布专项门禁」：① main 最近一次 PR Checks 必须 success；
    #     ② Windows 敏感测试子集（路径/备份/同步/菜单/API 契约）；③ 前端类型检查 +
    #     导航重构关键测试子集；④ 失败时上传完整日志 artifact（便于定位而不是只能看到 exit 1）。
    # W24（v1.15.5）：脚本内 release gate 默认轮询上限 75 分钟（--timeout-minutes 75），
    # 原 30 分钟会在门禁等待期间先被 job timeout 杀掉，丢掉"PR Checks 未通过/等待超时"
    # 的可读 ::error::。此处放宽到 90 分钟（75 等待 + 依赖安装/冒烟子集约 10 分钟）。
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: '3.11' }
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with: { node-version: '22' }

      # ① 发布前置门禁（v1.14.2 修复时序缺陷）：必须校验「tag 指向的提交」自身的
      #    PR Checks 结论，而不是「main 最近一次 completed」——后者在 tag 推送瞬间可能
      #    还指向更早的失败 run（v1.14.1 tag 构建即因此被误拦：68fc9cf 的 PR Checks
      #    尚在 in_progress，而最近 completed 是 422f840 的 e2e/upgrade-rehearsal 失败）。
      #    实现见 scripts/check_release_gate.py：tag commit 有 PR Checks → 轮询等待
      #    完成（≤75 分钟）后按结论放行/阻断；无或并发取消 → 回退 main 最近 completed。
      - name: Verify release gate is green
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/check_release_gate.py --timeout-minutes 75 --poll-seconds 60

      # 依赖安装（子集测试需要后端运行时/测试依赖；v1.13.2 修复：v1.13.1 重构时
      # 误删了本步骤，导致 `python -m pytest` 秒失败 No module named pytest）
      - name: Install backend dependencies
        shell: bash
        run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt

      # ② 后端 Windows 敏感子集（覆盖路径口径、备份对齐、数据同步路由、菜单单一源、
      #    帮扶村 API 契约、打包卫生门禁），约 1-2 分钟。
      - name: Backend release smoke subset
        shell: bash
        run: |
          cd backend
          set -o pipefail
          python -m pytest \
            tests/unit/test_menus_v2.py \
            tests/unit/test_paths.py \
            tests/unit/test_backup_path_alignment.py \
            tests/unit/test_data_sync_route.py \
            tests/unit/test_supported_village_api.py \
            tests/unit/test_verify_package_no_tests_v123.py \
            -q --tb=short 2>&1 | tee "$RUNNER_TEMP/backend-smoke.log"
      # ③ 前端类型检查 + 导航重构关键测试子集（不含全量 vitest，全量在 PR Checks）。
      - name: Frontend release smoke subset
        shell: bash
        run: |
          cd frontend
          npm ci --legacy-peer-deps --prefer-offline || npm install --legacy-peer-deps
          npx vue-tsc --noEmit 2>&1 | tee "$RUNNER_TEMP/frontend-tsc.log"
          set -o pipefail
          npx vitest run \
            tests/unit/stores/menu.test.ts \
            tests/unit/layouts/DefaultLayoutSafe.test.ts \
            tests/unit/views/system/SystemConsole.test.ts \
            tests/unit/router/router-index.test.ts \
            tests/unit/views/smoke.test.ts \
            2>&1 | tee "$RUNNER_TEMP/frontend-smoke.log"
      - name: Upload release smoke logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-smoke-logs
          path: |
            ${{ runner.temp }}/backend-smoke.log
            ${{ runner.temp }}/frontend-tsc.log
            ${{ runner.temp }}/frontend-smoke.log
          if-no-files-found: warn
          retention-days: 14

  build-windows:
    needs: smoke-test
    # W4-T9：仅当 smoke-test 成功才构建/发布（原 if: always() 会在测试失败时照样出包并发 Release）
    if: success()
    runs-on: windows-2022
    timeout-minutes: 90
    # Windows 运行器（en-US）上 Python 对管道的默认 stdout 编码是 cp1252：
    # 任何输出中文的脚本（如 scripts/verify_package_no_tests.py）都会在第一个
    # print 抛 UnicodeEncodeError 并让步骤以 exit 1 失败 —— v1.12.3 的 Windows
    # 出包正是这样被误拦。此处统一开启 UTF-8 模式（脚本内亦有兜底）。
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: 'utf-8'

    steps:
      # 1. Checkout
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # 2. Node.js
      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      # 3. Python x64（x86/32-bit 已放弃：上游科学计算包不再提供 win32 cp311 wheels）
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          architecture: x64

      # 4. 前端依赖缓存 + 构建
      - name: Cache frontend dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-fe-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-fe-

      - name: Build frontend
        shell: bash
        run: |
          cd frontend
          npm ci --legacy-peer-deps --prefer-offline || npm install --legacy-peer-deps
          # 2>&1 将 stderr 重定向到 stdout，避免 GitHub Actions 在 Windows 上
          # 将 Vite/Rollup 的进度输出误判为错误并产生 false annotation
          npm run build 2>&1

      # M55（2026-10-14）：此处原有 "Sync frontend to resources"（cp frontend/dist →
      # resources/frontend）。已删除——electron-builder 的 extraResources 直接以
      # `from: frontend/dist` 复制到安装包内 resources/frontend（electron/main.js
      # getFrontendPath() 打包态只读 process.resourcesPath/frontend），PyInstaller
      # spec 不打包 resources/frontend（frontend/dist 由 Electron 单独提供），
      # 全仓库无消费方 → 死步骤。resources/frontend 的本地同步仅由
      # scripts/build/sync-frontend-dist.{sh,bat} 服务 standalone/Web 部署，与本
      # Windows 安装包链路无关。

      # 5. 版本同步 (仅 tag 触发)
      # M53（2026-10-14）：版本同步收口到单一工具 scripts/sync-version.js
      # （scripts/sync_version.py 现为薄封装，保留仅为兼容历史调用）。
      # 直接调用 .js 可保证 CI 出包与 CI 版本门禁用**同一份目标集**。
      - name: Sync version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: node scripts/sync-version.js --write ${{ github.ref_name }}

      # 5b. 生成构建元数据
      - name: Generate build info
        shell: bash
        run: python scripts/generate_build_info.py ${{ github.ref_name || 'dev' }}

      # 6. 安装 Python 依赖 + PyInstaller
      - name: Install Python deps
        shell: bash
        run: |
          set +e
          pip install --upgrade pip cython setuptools wheel
          # prophet 依赖 cmdstan C++ 编译，单独处理（失败不阻断，系统自动降级离线模式）
          sed '/^prophet/d;/^cmdstanpy/d;/^stanio/d;/^pytokens/d' backend/requirements.txt > req-core.txt
          pip install --prefer-binary -r req-core.txt
          pip install prophet==1.3.0 2>/dev/null || echo "PROPHET_UNAVAILABLE=true" >> $GITHUB_ENV
          pip install -r backend/requirements-build.txt
          exit 0

      # 7. PyInstaller 打包后端
      - name: Build backend (PyInstaller)
        shell: bash
        run: cd backend && python -m PyInstaller assistance-backend.spec --clean --noconfirm

      # 7b. 瓦片包预置校验（F 区，2026-10-21）：默认 --require-min 0 —— 允许本次
      #     构建不带预置瓦片（仓库只有占位 README），但仍校验 MANIFEST 合法性
      #     （resources/map-tiles/MANIFEST.json 存在时必须自洽）。
      #     仓库变量 MAP_TILES_REQUIRED=1 时要求至少 1 张瓦片，防止"忘了拷瓦片
      #     就出包、装机后地图空白"静默发生。瓦片本体不进 git，由构建机拷入。
      - name: Verify map tiles preset
        shell: bash
        env:
          MAP_TILES_REQUIRED: ${{ vars.MAP_TILES_REQUIRED || '0' }}
        run: |
          python scripts/tiles/verify_tiles.py --require-min "${MAP_TILES_REQUIRED:-0}"

      # 8. 验证后端产物（onedir 目录布局，ADR-0006）
      - name: Verify backend exe
        shell: pwsh
        run: |
          if (-not (Test-Path "backend/dist/assistance-backend/assistance-backend.exe")) {
            throw "backend exe not found: backend/dist/assistance-backend/assistance-backend.exe"
          }
          $size = [math]::Round((Get-Item backend/dist/assistance-backend/assistance-backend.exe).Length / 1MB, 1)
          Write-Host "Backend exe size: ${size}MB"
          $internal = Get-ChildItem backend/dist/assistance-backend/_internal -Recurse -File | Measure-Object -Property Length -Sum
          Write-Host ("_internal: {0} files, {1}MB" -f $internal.Count, [math]::Round($internal.Sum / 1MB, 1))

      # 8a. 打包卫生门禁：产物不得包含测试文件/测试目录/测试依赖（2026-09-12）
      - name: Verify no test files in package
        shell: bash
        run: python scripts/verify_package_no_tests.py --backend-dir backend/dist/assistance-backend --frontend-dir frontend/dist

      # 8b. 构建指纹门禁（H12，2026-10-14）：onedir 产物必须包含 CI 生成的
      #     app/core/_build_info.json（builder=ci），否则冻结后端 /health/full
      #     永远上报 dev 指纹，分发溯源失效。脚本输出全 ASCII（en-US 运行器
      #     cp1252 stdout 兜底，见 job 级 PYTHONUTF8 注释）。
      - name: Verify build info in package
        shell: bash
        run: python scripts/verify_build_info.py --backend-dir backend/dist/assistance-backend

      # 8.5 后端 exe 签名（W6-T1，可选）：仓库 secrets 配置 CSC_LINK / CSC_KEY_PASSWORD
      # 后自动启用；未配置则显式 WARNING 跳过（不影响构建）。第 10 步 electron-builder
      # 会用同一对密钥自动签名安装包与卸载器。接入与验证方法见
      # docs/04-部署文档/01-Windows部署/代码签名.md
      - name: Sign backend exe (optional, W6-T1)
        shell: pwsh
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CSC_LINK)) {
            Write-Warning "未配置 CSC_LINK secret —— 跳过代码签名。军队白名单场景需要签名，接入方法见 docs/04-部署文档/01-Windows部署/代码签名.md"
            exit 0
          }
          # 仅在密钥存在时经 GITHUB_ENV 传给 electron-builder——直接写 step env
          # 会在 secret 缺失时注入空字符串，electron-builder 24.x 会把空串当
          # 证书路径解析(cwd)导致整个构建失败(v1.11.0 第二次构建失败根因)
          "CSC_LINK=$env:CSC_LINK" >> $env:GITHUB_ENV
          "CSC_KEY_PASSWORD=$env:CSC_KEY_PASSWORD" >> $env:GITHUB_ENV
          $cert = Join-Path $env:RUNNER_TEMP "codesign.pfx"
          if (Test-Path $env:CSC_LINK) {
            Copy-Item $env:CSC_LINK $cert
          } else {
            # electron-builder 惯例：CSC_LINK 也可以是 base64 编码的 PFX
            [IO.File]::WriteAllBytes($cert, [Convert]::FromBase64String($env:CSC_LINK))
          }
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw "未找到 signtool.exe（Windows SDK）" }
          $target = "backend/dist/assistance-backend/assistance-backend.exe"
          & $signtool.FullName sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /f $cert /p $env:CSC_KEY_PASSWORD $target
          if ($LASTEXITCODE -ne 0) { throw "signtool sign 失败 (exit $LASTEXITCODE)" }
          & $signtool.FullName verify /pa /all $target
          if ($LASTEXITCODE -ne 0) { throw "signtool verify 失败 (exit $LASTEXITCODE)" }
          Remove-Item $cert -Force
          Write-Host "后端 exe 已签名并通过验证"

      # 9. 安装 Electron 依赖 (根目录)
      # 网络抖动治理（2026-10-06）：与 pr-checks 的 frontend-check 同款加固，
      # 避免一次 registry 抖动让整条出包流水线失败（历史 nightly/e2e 均因此报红）。
      - name: Install Electron deps
        shell: bash
        run: |
          npm config set fetch-retries 5
          npm config set fetch-retry-mintimeout 20000
          npm config set fetch-retry-maxtimeout 120000
          npm config set fetch-timeout 300000
          for i in 1 2 3; do
            echo "===== npm ci attempt $i ====="
            if npm ci; then
              echo "npm ci OK (attempt $i)"
              exit 0
            fi
            echo "npm ci attempt $i failed; retrying in 10s"
            sleep 10
          done
          echo "::error::npm ci 连续 3 次失败 —— 疑似 registry 网络故障或 package-lock 不一致，非业务代码问题"
          exit 1

      # 9.5 Electron 主进程语法门禁（防再发 10c56cd0 乱码损坏进入安装包）
      - name: Syntax check Electron main process
        shell: bash
        run: |
          for f in electron/*.js; do
            node --check "$f" || { echo "::error::Electron 语法检查失败: $f"; exit 1; }
          done
          echo "Electron 语法检查通过 ($(ls electron/*.js | wc -l) 个文件)"

      # 9.6 下载 VC++ Redistributable（已移出 git，改官方 URL 拉取 + SHA256 钉扎校验）
      - name: Fetch VC++ Redistributable (pinned SHA256)
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/build/fetch_vcredist.ps1

      # 10. electron-builder 打包（CSC_LINK/CSC_KEY_PASSWORD 由 8.5 步按需写入
      #     GITHUB_ENV——secret 缺失时不设置，避免空串被当作证书路径）
      - name: Build installer (electron-builder)
        run: npx electron-builder --win --x64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 10.2 安装产物自包含冒烟（v1.13.1 引入；v1.13.3 增加诊断输出与动态端口）：
      #      直接运行 electron-builder 解包后的打包后端 exe（onedir），按 Electron 运行期
      #      注入的数据目录 env 启动，验证「解包即用、不依赖系统 Python / 预装依赖 / 额外运行库」。
      #      runner 上虽然装了 Python，但该 exe 是 PyInstaller 冻结产物，加载的是同目录
      #      _internal 下的解释器与 DLL；同时断言运行库与前端资源都在包内。
      #      v1.13.3：固定 8123 端口在 runner 上可能被占用 → 18123 起自动挑选空闲端口；
      #      后端 stdout/stderr 重定向落盘，失败时打印尾部并上传 artifact（否则只能看到 exit 1）。
      - name: Smoke test packaged backend (self-contained)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = "dist/electron/win-unpacked/resources"
          $exe = Join-Path $root "backend/assistance-backend/assistance-backend.exe"
          $required = @(
            $exe,
            (Join-Path $root "backend/assistance-backend/_internal/python311.dll"),
            (Join-Path $root "backend/assistance-backend/_internal/VCRUNTIME140.dll"),
            (Join-Path $root "backend/assistance-backend/_internal/VCRUNTIME140_1.dll"),
            (Join-Path $root "backend/assistance-backend/_internal/MSVCP140.dll"),
            (Join-Path $root "backend/assistance-backend/_internal/alembic.ini"),
            (Join-Path $root "frontend/index.html"),
            (Join-Path $root "vcredist/vc_redist.x64.exe")
          )
          foreach ($p in $required) {
            if (-not (Test-Path $p)) { throw "安装包缺少自包含运行时组件: $p" }
          }
          Write-Host "自包含组件检查通过（解释器/DLL/alembic/前端/VC++ 运行库均在包内）"

          $port = 0
          foreach ($candidate in 18123..18140) {
            $inUse = Get-NetTCPConnection -LocalPort $candidate -State Listen -ErrorAction SilentlyContinue
            if (-not $inUse) { $port = $candidate; break }
          }
          if ($port -eq 0) { throw "18123-18140 端口均被占用，无法启动冒烟后端" }
          Write-Host "冒烟端口: $port"

          $data = Join-Path $env:RUNNER_TEMP "packaged-smoke-data"
          New-Item -ItemType Directory -Force -Path $data | Out-Null
          $env:DATABASE_URL = "sqlite:///" + (($data -replace '\\', '/') + "/smoke.db")
          $appLog = Join-Path $data "app.log"
          $env:LOG_FILE = $appLog
          $env:UPLOAD_DIR = Join-Path $data "uploads"
          $env:EXPORT_DIR = Join-Path $data "exports"
          $env:CACHE_DIR = Join-Path $data "cache"
          $env:HOST = "127.0.0.1"
          $env:PORT = "$port"
          $stdout = Join-Path $data "backend-stdout.log"
          $stderr = Join-Path $data "backend-stderr.log"
          $proc = Start-Process -FilePath $exe -WorkingDirectory (Split-Path $exe) -PassThru `
            -WindowStyle Hidden -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          $healthy = $false
          $earlyExit = $false
          try {
            for ($i = 0; $i -lt 60; $i++) {
              Start-Sleep -Seconds 3
              if ($proc.HasExited) { $earlyExit = $true; break }
              try {
                $r = Invoke-WebRequest -Uri "http://127.0.0.1:$port/health" -UseBasicParsing -TimeoutSec 5
                $healthy = $true; break
              } catch {}
            }
          } finally {
            if ($proc -and -not $proc.HasExited) { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue }
          }
          Write-Host "===== 打包后端 stdout（尾部）====="
          if (Test-Path $stdout) { Get-Content $stdout -Tail 40 }
          Write-Host "===== 打包后端 stderr（尾部）====="
          if (Test-Path $stderr) { Get-Content $stderr -Tail 60 }
          Write-Host "===== app.log（尾部）====="
          if (Test-Path $appLog) { Get-Content $appLog -Tail 80 }
          if ($earlyExit) {
            Write-Host "::error::打包后端进程提前退出 exit_code=$($proc.ExitCode)（stderr/app.log 见上方步骤日志与 packaged-backend-smoke-logs artifact）"
            throw "打包后端进程提前退出（exit_code=$($proc.ExitCode)），见上方日志"
          }
          if (-not $healthy) {
            Write-Host "::error::打包后端未在 180 秒内通过 /health（端口 $port），见上方步骤日志与 artifact"
            throw "打包后端未在 180 秒内通过 /health（端口 $port）"
          }
          $health = $r.Content | ConvertFrom-Json
          if ($health.status -ne 'ok') { throw "health.status=$($health.status)" }
          if (-not $health.version) { throw "health 缺少 version" }
          if (-not $health.git_hash) { throw "health 缺少 git_hash" }
          if ($health.migration.at_head -ne $true) { throw "数据库未迁移到 head: $($health.migration | ConvertTo-Json -Compress)" }
          Write-Host "打包后端自包含冒烟通过: version=$($health.version) git_hash=$($health.git_hash) migration_head=$($health.migration.head)"

      - name: Upload packaged backend smoke logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: packaged-backend-smoke-logs
          path: ${{ runner.temp }}/packaged-smoke-data/*.log
          if-no-files-found: warn
          retention-days: 14

      # 10.6 安装包内容抽查：NSIS 安装包可被 7z 列举，确认无测试内容
      #      规则收口到 scripts/verify_package_no_tests.py --listing（与文件树扫描同一
      #      实现 + 同一厂商豁免表）。此前内联正则没有豁免表，会把 prophet/cmdstan 自带
      #      的 src/test/*.cpp（实测 283 项）误判为违规而阻断 Windows 出包。
      - name: Verify installer contains no tests
        shell: pwsh
        run: |
          $exe = Get-ChildItem "dist/electron/*.exe" | Select-Object -First 1
          if (-not $exe) { throw "dist/electron/*.exe not found" }
          $sevenZip = "C:\Program Files\7-Zip\7z.exe"
          if (-not (Test-Path $sevenZip)) {
            Write-Warning "7-Zip 不可用，跳过安装包内容抽查（onedir 级验证已通过）"
            exit 0
          }
          $listing = Join-Path $env:RUNNER_TEMP "installer-listing.txt"
          & $sevenZip l $exe.FullName | Out-File -FilePath $listing -Encoding utf8
          if ($LASTEXITCODE -ne 0) { throw "7z 列举失败 (exit $LASTEXITCODE)" }
          python scripts/verify_package_no_tests.py --listing $listing

      # 10.5 生成产物 SHA256 清单（军队分发完整性链，W6-T5）
      - name: Generate SHA256SUMS
        shell: pwsh
        run: |
          $exes = Get-ChildItem "dist/electron/*.exe"
          if (-not $exes) { throw "dist/electron/*.exe not found" }
          $lines = $exes | Sort-Object Name | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash.ToLower(), $_.Name
          }
          $sums = Join-Path $PWD "dist/electron/SHA256SUMS-windows-x64.txt"
          # UTF-8 无 BOM + LF 行尾：WriteAllLines 在 Windows 会写 CRLF，
          # 导致 sha256sum -c 解析文件名带 \r 全部 FAILED（本地 dry-run 实测）
          [IO.File]::WriteAllText($sums, ($lines -join "`n") + "`n", (New-Object Text.UTF8Encoding($false)))
          Get-Content $sums

      # 11. 上传制品
      - name: Upload installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-installer-x64
          path: |
            dist/electron/*.exe
            dist/electron/SHA256SUMS-windows-x64.txt
          retention-days: 30

      # 11.5 准备 Release 正文（单源：仓库里的 RELEASE_NOTES-<tag>.md）
      # 为什么需要：Release 由 3 个作业各自上传（本文件 1 个 + build-arm64.yml 2 个），
      # softprops/action-gh-release 每次都会重写 body —— 不传 body 的作业会把正文清空。
      # v1.18.1 实测就出现过「Release 正文 0 字符」：Windows 侧写了正文，随后 ARM64 两个
      # 作业把 body 覆盖成空。故三个发布步骤统一改为从同一文件 body_path 读取。
      - name: Prepare release body
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          SRC="docs/04-部署文档/RELEASE_NOTES-${GITHUB_REF_NAME}.md"
          if [ -f "$SRC" ]; then
            cp "$SRC" "$RUNNER_TEMP/release-body.md"
            echo "使用发布说明: $SRC"
          else
            {
              echo "## ${GITHUB_REF_NAME}"
              echo
              echo "> 本版未提供 \`docs/04-部署文档/RELEASE_NOTES-${GITHUB_REF_NAME}.md\`，"
              echo "> 逐项变更见仓库根目录 \`CHANGELOG.md\`。"
              echo
              echo "## 产物完整性校验（SHA256）"
              echo
              echo "下载安装包与对应 \`SHA256SUMS-*.txt\` 到同一目录后执行 \`sha256sum -c SHA256SUMS-*.txt\`，"
              echo "所有行必须为 \`OK\`。"
            } > "$RUNNER_TEMP/release-body.md"
            echo "::warning::未找到 $SRC，使用兜底正文"
          fi

      # 12. 发布 Release (仅 tag 触发)
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            dist/electron/*.exe
            dist/electron/SHA256SUMS-windows-x64.txt
          generate_release_notes: false
          body_path: ${{ runner.temp }}/release-body.md
