name: Build Windows Installer (x64)

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  NODE_VERSION: '22'
  PYTHON_VERSION: '3.11'

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    # 鍚庣鍏ㄩ噺 pytest锛?.2涓?锛? 鍓嶇 vitest锛?.4k+锛夊悎璁″凡瓒?30 鍒嗛挓棰勭畻锛?    # 2026-08-15 涓夋杩愯鍧囧湪鍓嶇姝ラ杩涜涓 30min 瓒呮椂鎺愭柇锛堢粨璁鸿涓?cancelled锛?    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - uses: actions/setup-node@v5
        with: { node-version: '22' }
      - name: Backend smoke test
        continue-on-error: true
        run: |
          pip install -r backend/requirements.txt -r backend/requirements-dev.txt
          # 娉ㄦ剰锛?-dist loadfile 涓?pytest-rerunfailures 涓嶅吋瀹癸紙worker 宕╂簝鏃?          # mark_test_pending 鍦?loadscope 璋冨害鍣ㄤ笂鎶?NotImplementedError锛夛紝
          # 浣跨敤榛樿 load 璋冨害鍣ㄨ rerun 姝ｅ父鐢熸晥銆?          cd backend && python -m pytest tests/ -q --tb=short -n auto --cov=app --cov-report=term --cov-fail-under=50 --reruns 3 --reruns-delay 1 --junitxml=test-results.xml
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: backend/test-results.xml
          retention-days: 7
      - name: Frontend smoke test
        continue-on-error: true
        run: |
          cd frontend
          npm ci --legacy-peer-deps --prefer-offline || npm install --legacy-peer-deps
          npx vue-tsc --noEmit 2>&1
          npx vitest run 2>&1

  build-windows:
    needs: smoke-test
    if: always()
    runs-on: windows-2022
    timeout-minutes: 90

    steps:
      # 1. Checkout
      - uses: actions/checkout@v4

      # 2. Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      # 3. Python x64锛坸86/32-bit 宸叉斁寮冿細涓婃父绉戝璁＄畻鍖呬笉鍐嶆彁渚?win32 cp311 wheels锛?      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          architecture: x64

      # 4. 鍓嶇渚濊禆缂撳瓨 + 鏋勫缓
      - name: Cache frontend dependencies
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-fe-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-fe-

      - name: Build frontend
        shell: bash
        run: |
          cd frontend
          npm ci --legacy-peer-deps --prefer-offline || npm install --legacy-peer-deps
          # 2>&1 灏?stderr 閲嶅畾鍚戝埌 stdout锛岄伩鍏?GitHub Actions 鍦?Windows 涓?          # 灏?Vite/Rollup 鐨勮繘搴﹁緭鍑鸿鍒や负閿欒骞朵骇鐢?false annotation
          npm run build 2>&1

      - name: Sync frontend to resources
        shell: pwsh
        run: |
          $source = "frontend\dist"
          $dest = "resources\frontend"
          if (Test-Path $source) {
            New-Item -ItemType Directory -Force -Path $dest | Out-Null
            Copy-Item -Path "$source\*" -Destination $dest -Recurse -Force
            Write-Host "Frontend resources synced to $dest"
          } else {
            Write-Error "frontend\dist not found"
            exit 1
          }

      # 5. 鐗堟湰鍚屾 (浠?tag 瑙﹀彂)
      - name: Sync version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: python scripts/sync_version.py ${{ github.ref_name }}

      # 5b. 鐢熸垚鏋勫缓鍏冩暟鎹?      - name: Generate build info
        shell: bash
        run: python scripts/generate_build_info.py ${{ github.ref_name || 'dev' }}

      # 6. 瀹夎 Python 渚濊禆 + PyInstaller
      - name: Install Python deps
        shell: bash
        run: |
          set +e
          pip install --upgrade pip cython setuptools wheel
          # prophet 渚濊禆 cmdstan C++ 缂栬瘧锛屽崟鐙鐞嗭紙澶辫触涓嶉樆鏂紝绯荤粺鑷姩闄嶇骇绂荤嚎妯″紡锛?          sed '/^prophet/d;/^cmdstanpy/d;/^stanio/d;/^pytokens/d' backend/requirements.txt > req-core.txt
          pip install --prefer-binary -r req-core.txt
          pip install prophet==1.3.0 2>/dev/null || echo "PROPHET_UNAVAILABLE=true" >> $GITHUB_ENV
          pip install -r backend/requirements-build.txt
          exit 0

      # 7. PyInstaller 鎵撳寘鍚庣
      - name: Build backend (PyInstaller)
        shell: bash
        run: cd backend && python -m PyInstaller assistance-backend.spec --clean --noconfirm

      # 8. 楠岃瘉鍚庣浜х墿
      - name: Verify backend exe
        shell: pwsh
        run: |
          if (-not (Test-Path "backend/dist/assistance-backend.exe")) {
            throw "backend exe not found: backend/dist/assistance-backend.exe"
          }
          $size = [math]::Round((Get-Item backend/dist/assistance-backend.exe).Length / 1MB, 1)
          Write-Host "Backend exe size: ${size}MB"

      # 9. 瀹夎 Electron 渚濊禆 (鏍圭洰褰?
      - name: Install Electron deps
        run: npm ci

      # 10. electron-builder 鎵撳寘
      - name: Build installer (electron-builder)
        run: npx electron-builder --win --x64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 11. 涓婁紶鍒跺搧
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-x64
          path: dist/electron/*.exe
          retention-days: 30

      # 12. 鍙戝竷 Release (浠?tag 瑙﹀彂)
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/electron/*.exe
          generate_release_notes: true
