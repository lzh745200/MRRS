name: Build Windows Installer (x64)

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  NODE_VERSION: '22'
  PYTHON_VERSION: '3.11'

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    # 后端全量 pytest（1.2万+）+ 前端 vitest（6.4k+）合计已超 30 分钟预算；
    # 2026-08-15 三次运行均在前端步骤进行中被 30min 超时掐断（结论记为 cancelled），
    # 故放宽到 60 分钟。
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - uses: actions/setup-node@v5
        with: { node-version: '22' }
      - name: Backend smoke test
        continue-on-error: true
        run: |
          pip install -r backend/requirements.txt -r backend/requirements-dev.txt
          # 注意：-dist loadfile 与 pytest-rerunfailures 不兼容（worker 崩溃时
          # mark_test_pending 在 loadscope 调度器上抛 NotImplementedError），
          # 使用默认 load 调度器让 rerun 正常生效。
          cd backend && python -m pytest tests/ -q --tb=short -n auto --cov=app --cov-report=term --cov-fail-under=50 --reruns 3 --reruns-delay 1 --junitxml=test-results.xml
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: backend/test-results.xml
          retention-days: 7
      - name: Frontend smoke test
        continue-on-error: true
        run: |
          cd frontend
          npm ci --legacy-peer-deps --prefer-offline || npm install --legacy-peer-deps
          npx vue-tsc --noEmit 2>&1
          npx vitest run 2>&1

  build-windows:
    needs: smoke-test
    if: always()
    runs-on: windows-2022
    timeout-minutes: 90

    steps:
      # 1. Checkout
      - uses: actions/checkout@v4

      # 2. Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      # 3. Python x64（x86/32-bit 已放弃：上游科学计算包不再提供 win32 cp311 wheels）
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          architecture: x64

      # 4. 前端依赖缓存 + 构建
      - name: Cache frontend dependencies
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-fe-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-fe-

      - name: Build frontend
        shell: bash
        run: |
          cd frontend
          npm ci --legacy-peer-deps --prefer-offline || npm install --legacy-peer-deps
          # 2>&1 将 stderr 重定向到 stdout，避免 GitHub Actions 在 Windows 上
          # 将 Vite/Rollup 的进度输出误判为错误并产生 false annotation
          npm run build 2>&1

      - name: Sync frontend to resources
        shell: pwsh
        run: |
          $source = "frontend\dist"
          $dest = "resources\frontend"
          if (Test-Path $source) {
            New-Item -ItemType Directory -Force -Path $dest | Out-Null
            Copy-Item -Path "$source\*" -Destination $dest -Recurse -Force
            Write-Host "Frontend resources synced to $dest"
          } else {
            Write-Error "frontend\dist not found"
            exit 1
          }

      # 5. 版本同步 (仅 tag 触发)
      - name: Sync version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: python scripts/sync_version.py ${{ github.ref_name }}

      # 5b. 生成构建元数据
      - name: Generate build info
        shell: bash
        run: python scripts/generate_build_info.py ${{ github.ref_name || 'dev' }}

      # 6. 安装 Python 依赖 + PyInstaller
      - name: Install Python deps
        shell: bash
        run: |
          set +e
          pip install --upgrade pip cython setuptools wheel
          # prophet 依赖 cmdstan C++ 编译，单独处理（失败不阻断，系统自动降级离线模式）
          sed '/^prophet/d;/^cmdstanpy/d;/^stanio/d;/^pytokens/d' backend/requirements.txt > req-core.txt
          pip install --prefer-binary -r req-core.txt
          pip install prophet==1.3.0 2>/dev/null || echo "PROPHET_UNAVAILABLE=true" >> $GITHUB_ENV
          pip install -r backend/requirements-build.txt
          exit 0

      # 7. PyInstaller 打包后端
      - name: Build backend (PyInstaller)
        shell: bash
        run: cd backend && python -m PyInstaller assistance-backend.spec --clean --noconfirm

      # 8. 验证后端产物
      - name: Verify backend exe
        shell: pwsh
        run: |
          if (-not (Test-Path "backend/dist/assistance-backend.exe")) {
            throw "backend exe not found: backend/dist/assistance-backend.exe"
          }
          $size = [math]::Round((Get-Item backend/dist/assistance-backend.exe).Length / 1MB, 1)
          Write-Host "Backend exe size: ${size}MB"

      # 9. 安装 Electron 依赖 (根目录)
      - name: Install Electron deps
        run: npm ci

      # 9.5 Electron 主进程语法门禁（防再发 10c56cd0 乱码损坏进入安装包）
      - name: Syntax check Electron main process
        shell: bash
        run: |
          for f in electron/*.js; do
            node --check "$f" || { echo "::error::Electron 语法检查失败: $f"; exit 1; }
          done
          echo "Electron 语法检查通过 ($(ls electron/*.js | wc -l) 个文件)"

      # 9.6 下载 VC++ Redistributable（已移出 git，改官方 URL 拉取 + SHA256 钉扎校验）
      - name: Fetch VC++ Redistributable (pinned SHA256)
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/build/fetch_vcredist.ps1

      # 10. electron-builder 打包
      - name: Build installer (electron-builder)
        run: npx electron-builder --win --x64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 10.5 生成产物 SHA256 清单（军队分发完整性链，W6-T5）
      - name: Generate SHA256SUMS
        shell: pwsh
        run: |
          $exes = Get-ChildItem "dist/electron/*.exe"
          if (-not $exes) { throw "dist/electron/*.exe not found" }
          $lines = $exes | Sort-Object Name | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash.ToLower(), $_.Name
          }
          $sums = Join-Path $PWD "dist/electron/SHA256SUMS-windows-x64.txt"
          # UTF-8 无 BOM，保持 sha256sum -c 兼容（文件名含中文）
          [IO.File]::WriteAllLines($sums, $lines, (New-Object Text.UTF8Encoding($false)))
          Get-Content $sums

      # 11. 上传制品
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-x64
          path: |
            dist/electron/*.exe
            dist/electron/SHA256SUMS-windows-x64.txt
          retention-days: 30

      # 12. 发布 Release (仅 tag 触发)
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/electron/*.exe
            dist/electron/SHA256SUMS-windows-x64.txt
          generate_release_notes: true
          body: |
            ## 产物完整性校验（SHA256）

            下载安装包与对应 `SHA256SUMS-*.txt` 到同一目录后执行：

            ```bash
            sha256sum -c SHA256SUMS-windows-x64.txt
            ```

            所有行必须为 `OK`；出现 `FAILED` 表示文件损坏或被篡改，请勿安装。
            > 代码签名（W6-T1）待证书采购到位后启用，届时本节补充 Authenticode 验签说明。
